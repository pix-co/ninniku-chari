<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>走れニンニクマン(開発中)</title>
<style>
  :root{ color-scheme: dark; }
  html,body{ margin:0; padding:0; background:#1b2a3a; height:100%; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center; font-family:'Yu Gothic',Meiryo,sans-serif; }
  #wrap{ position:relative; width:960px; height:540px; transform-origin: center center; }
  canvas{ display:block; width:960px; height:540px; background:#8fd0f2; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.5); touch-action:none; }
  .touchBtn{ position:absolute; width:74px; height:74px; border-radius:50%; background:rgba(255,255,255,.28); border:3px solid rgba(255,255,255,.65); color:#fff; font-size:26px; font-weight:bold; display:none; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; touch-action:none; }
  .touchBtn.show{ display:flex; }
  .touchBtn:active{ background:rgba(255,255,255,.5); }
  #tcLeanBack{ left:22px; bottom:112px; }
  #tcLeanFwd{ left:22px; bottom:22px; }
  #tcHint{ position:absolute; bottom:26px; right:22px; color:#fff; font-size:13px; font-weight:bold; text-shadow:0 1px 3px rgba(0,0,0,.6); display:none; }
  #tcHint.show{ display:block; }
  #soundToggleBtn{ position:absolute; top:6px; left:700px; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.5); color:#fff; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  #hud{ position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; pointer-events:none; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); font-size:15px; font-weight:bold; }
  #hud .box{ background:rgba(0,0,0,.35); padding:6px 12px; border-radius:8px; }
  #mascotImg{ position:absolute; top:6px; left:400px; width:52px; height:auto; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  #bubble{ position:absolute; top:12px; left:458px; background:#fff; border:2px solid #C8481A; border-radius:14px; padding:6px 14px; font-size:13px; font-weight:bold; color:#4a2c0f; white-space:nowrap; }
  .overlay{ position:absolute; inset:0; background:rgba(10,20,30,.72); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:#fff; text-align:center; }
  .overlay.hidden{ display:none; }
  .overlay h1{ margin:0; font-size:34px; color:#F3980D; text-shadow:0 2px 4px rgba(0,0,0,.5); }
  .overlay p{ margin:0; font-size:16px; }
  .btn{ background:#F3980D; color:#3a1f00; border:none; border-radius:10px; padding:12px 30px; font-size:17px; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #a5650a; }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #a5650a; }
  .btn.secondary{ background:#fff; color:#C8481A; box-shadow:0 4px 0 #cbb9a0; }
  .btn-row{ display:flex; gap:12px; }
  .gameover-selected{ background:#F3980D !important; color:#fff !important; box-shadow:0 4px 0 #a5650a !important; }
  .gameover-unselected{ background:#fff !important; color:#C8481A !important; box-shadow:0 4px 0 #cbb9a0 !important; }
  #progressWrap{ position:absolute; bottom:10px; left:10px; right:10px; height:10px; background:rgba(0,0,0,.35); border-radius:6px; overflow:hidden; }
  #progressBar{ height:100%; width:0%; background:linear-gradient(90deg,#F3980D,#C8481A); }
  #crashFlash{ position:absolute; inset:0; background:#ff0000; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hud">
    <div class="box">速度: <span id="speedVal">0</span> km/h</div>
    <div class="box">距離: <span id="distVal">0</span> / <span id="distTotal">0</span> m</div>
  </div>
  <img id="mascotImg" alt="ニンニクマン">
  <div id="bubble">がんばって〜!</div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="crashFlash"></div>
  <button class="touchBtn" id="tcLeanBack" type="button">↑</button>
  <button class="touchBtn" id="tcLeanFwd" type="button">↓</button>
  <div id="tcHint">タップでジャンプ</div>
  <button id="soundToggleBtn" type="button" title="効果音のON/OFF">🔊</button>

  <div id="startOverlay" class="overlay">
    <h1>走れニンニクマン</h1>
    <p>一定速度で自動的に走ります。加速・ブレーキ操作は不要!<br>Space(スマホはタップ): ジャンプ(穴や障害物にぶつかるとゲームオーバー!)<br>↑↓: 空中での姿勢制御(着地角度で失速・爆速が変わる)</p>
    <button class="btn" id="startBtn">スタート [Enter]</button>
  </div>

  <div id="goalOverlay" class="overlay hidden">
    <h1 id="goalTitle">ゴール!</h1>
    <p id="goalStats"></p>
    <div class="btn-row">
      <button class="btn" id="retryBtn">もう一度</button>
      <button class="btn secondary" id="backToStartBtn">スタートに戻る</button>
    </div>
  </div>

  <div id="pauseOverlay" class="overlay hidden">
    <h1>PAUSE</h1>
    <button class="btn" id="resumeBtn">再開 [P]</button>
  </div>
</div>

  const goalTitleEl = document.getElementById('goalTitle');
  const goalStatsEl = document.getElementById('goalStats');
  const retryBtnEl = document.getElementById('retryBtn');
  const backToStartBtnEl = document.getElementById('backToStartBtn');
  const tcLeanBackEl = document.getElementById('tcLeanBack');
  const tcLeanFwdEl = document.getElementById('tcLeanFwd');
  const tcHintEl = document.getElementById('tcHint');

  // ---------- Responsive scale (reused pattern from tetris_ninniku.html) ----------
  const popupMode = new URLSearchParams(location.search).get('popup') === '1';
  function fitToWindow(){
    wrapEl.style.transform = 'none';
    const w = wrapEl.offsetWidth, h = wrapEl.offsetHeight;
    const scale = Math.min(window.innerWidth / w, window.innerHeight / h, 1);
    wrapEl.style.transform = scale < 1 ? `scale(${scale})` : 'none';
  }
  window.addEventListener('resize', fitToWindow);
  window.addEventListener('orientationchange', fitToWindow);

  // ---------- Key bindings (reused save/load pattern) ----------
  const DEFAULT_KEYS = {
    leanForward: ['ArrowDown', 'KeyS'],
    leanBack: ['ArrowUp', 'KeyW'],
    jump: ['Space', null],
    pause: ['KeyP', null],
  };
  const KEY_ACTIONS = Object.keys(DEFAULT_KEYS);
  function cloneKeys(src){
    const out = {};
    KEY_ACTIONS.forEach(a => { out[a] = [src[a][0], src[a][1]]; });
    return out;
  }
  let keyBindings = cloneKeys(DEFAULT_KEYS);
  function loadKeyBindings(){
    try{
      const saved = JSON.parse(localStorage.getItem('ninniku-chari-keys') || '{}');
      keyBindings = cloneKeys(DEFAULT_KEYS);
      KEY_ACTIONS.forEach(a => {
        const v = saved[a];
        if(Array.isArray(v)){
          keyBindings[a] = [
            (typeof v[0] === 'string' || v[0] === null) ? v[0] : DEFAULT_KEYS[a][0],
            (typeof v[1] === 'string' || v[1] === null) ? v[1] : null,
          ];
        }
      });
    }catch(e){ keyBindings = cloneKeys(DEFAULT_KEYS); }
  }
  function actionForCode(code){
    for(const a of KEY_ACTIONS){ if(keyBindings[a].includes(code)) return a; }
    return null;
  }
  loadKeyBindings();

  const heldActions = new Set();
  window.addEventListener('keydown', (e) => {
    const action = actionForCode(e.code);
    if(action){ e.preventDefault(); heldActions.add(action); }
    if(action === 'pause'){ togglePause(); }
    if(action === 'jump' && !e.repeat){ tryJump(); }
    if(e.code === 'Escape' && state !== 'start'){ backToStart(); }
    if(!goalOverlayEl.classList.contains('hidden')){
      if(e.code === 'ArrowLeft' || e.code === 'ArrowUp'){ resultFocusIndex = 0; updateResultFocus(); }
      if(e.code === 'ArrowRight' || e.code === 'ArrowDown'){ resultFocusIndex = 1; updateResultFocus(); }
    }
    if(e.code === 'Enter' || e.code === 'Space'){
      if(!startOverlayEl.classList.contains('hidden')){ startGame(); }
      else if(!goalOverlayEl.classList.contains('hidden')){
        (resultFocusIndex === 0 ? retryBtnEl : backToStartBtnEl).click();
      }
    }
  });
  window.addEventListener('keyup', (e) => {
    const action = actionForCode(e.code);
    if(action){ heldActions.delete(action); }
  });

  // ---------- Terrain (固定コース、500m) ----------
  // Points define a ground polyline. gapAfter:true means there is NO ground
  // between this point and the next (a pit/ramp gap the player must jump).
  // 各ジャンプ台は dx=250,dy=-30 の登り坂で統一(巡航速度300px/s・ジャンプ初速420px/s
  // だと安全に180px前後まで届く実測値)、穴の幅は余裕を見て140pxに統一。
  const GROUND_BASE = 400;
  const COURSE_LENGTH = 5000; // 500m (距離表示は x/10 メートル)
  const GOAL_X = COURSE_LENGTH;
  const terrain = [
    { x: 0,    y: GROUND_BASE },
    { x: 500,  y: GROUND_BASE },       // 平坦なスタート区間
    { x: 800,  y: GROUND_BASE + 60 },
    { x: 1100, y: GROUND_BASE - 10 },
    { x: 1350, y: GROUND_BASE - 40, gapAfter: true }, // ジャンプ台1
    { x: 1490, y: GROUND_BASE - 10 },
    { x: 1800, y: GROUND_BASE + 10 },
    { x: 2100, y: GROUND_BASE - 60 },
    { x: 2400, y: GROUND_BASE + 10 },
    { x: 2650, y: GROUND_BASE - 20 },
    { x: 2900, y: GROUND_BASE - 50, gapAfter: true }, // ジャンプ台2
    { x: 3040, y: GROUND_BASE - 20 },
    { x: 3350, y: GROUND_BASE + 40 },
    { x: 3650, y: GROUND_BASE + 10 },
    { x: 3900, y: GROUND_BASE - 20, gapAfter: true }, // ジャンプ台3
    { x: 4040, y: GROUND_BASE + 10 },
    { x: 4350, y: GROUND_BASE },
    { x: 4550, y: GROUND_BASE },       // 平坦なゴール前区間
    { x: 5000, y: GROUND_BASE },       // goal
  ];
  const OBSTACLES = [
    { x: 650,  w: 26, h: 24 },
    { x: 1950, w: 28, h: 24 },
    { x: 2500, w: 24, h: 22 },
    { x: 3500, w: 30, h: 26 },
    { x: 4200, w: 24, h: 22 },
  ];

  function findSegment(x){
    for(let i = 0; i < terrain.length - 1; i++){
      if(x >= terrain[i].x && x <= terrain[i+1].x) return i;
    }
    return x < terrain[0].x ? 0 : terrain.length - 2;
  }

  // Returns {y, angle} of ground at x, or null if x is inside a gap (no ground).
  function groundInfoAt(x){
    const i = findSegment(x);
    const a = terrain[i], b = terrain[i+1];
    if(a.gapAfter) return null;
    const t = (x - a.x) / (b.x - a.x);
    const y = a.y + (b.y - a.y) * t;
    const angle = Math.atan2(b.y - a.y, b.x - a.x);
    return { y, angle };
  }

  // ---------- Physics constants ----------
  // 走れニンニクマンは一定速度で自動的に走り続けるゲームなので、加速・ブレーキ操作は無い。
  // プレイヤーが操作するのはジャンプのタイミングと、空中での姿勢(着地角度)のみ。
  const GRAVITY = 1500;          // px/s^2
  const CRUISE_SPEED = 300;      // px/s — 常にこの速度で走り続ける(操作不要)
  const SPEED_RECOVERY = 2.2;    // ジャンプ後の速度が巡航速度へ戻る速さ
  const AIR_ROT_SPEED = 2.6;     // rad/s bike rotation control while airborne
  const MAX_SPEED = 900;         // px/s
  const JUMP_IMPULSE = 420;      // upward kick from a manual jump (px/s)
  const PIT_FALL_Y = 640;        // falling past this = missed the jump, into the pit
  const LANDING_PERFECT_DEG = 10;
  const LANDING_OK_DEG = 30;
  const STREAK_BONUS_PER = 0.05; // 連続で着地に成功するたびに+5%ずつ加速が乗る
  const STREAK_CAP = 8;          // 最大+40%まで(それ以上は頭打ち)

  // マリオ64風の3段ジャンプ: 着地してすぐ(CHAIN_WINDOW_MS以内に)再ジャンプすると
  // 段数が上がってジャンプが高くなり、3段目でめっちゃ加速する。段数はそこでリセット。
  const CHAIN_WINDOW_MS = 300;
  const JUMP_IMPULSE_LV = [1, 1.3, 1.7];
  const TRIPLE_JUMP_SPEED_BOOST = 1.6;

  // ---------- Intro (マリオ風の土管から登場する演出) ----------
  const PIPE_X = 60;
  const PIPE_W = 46;
  const PIPE_RIM_H = 10;
  const PIPE_HEIGHT = 34;             // 地面から突き出ている土管の高さ
  const PIPE_TOP = GROUND_BASE - PIPE_HEIGHT;
  const INTRO_HIDDEN_DROP = 50;       // 土管の中(フチより下)の隠れた開始位置
  const INTRO_RISE_MS = 550;          // 第1段階: 土管のフチまでせり上がる
  const INTRO_STEP_MS = 250;          // 第2段階: 地面まで降りる

  // ---------- Game state ----------
  let state = 'start'; // 'start' | 'intro' | 'play' | 'paused' | 'goal' | 'gameover'
  let player, camX, elapsed, lastTime, introTimer, introPhase;
  let resultFocusIndex = 0; // 0 = もう一度, 1 = スタートに戻る (goal/gameover画面での選択)
  let comboPopup = null; // { text, timer, maxTimer } — 連続ジャンプ成功時に浮かぶ表示

  function resetPlayer(){
    player = {
      x: PIPE_X, y: GROUND_BASE, angle: 0, // 土管の位置から出てくるので、開始xを土管に合わせる
      speed: CRUISE_SPEED, // scalar forward speed while grounded
      vx: 0, vy: 0,        // used only while airborne
      airborne: false,
      legPhase: 0,
      jumpStreak: 0,
      jumpChain: 0,
      chainTimer: 0,
    };
    camX = 0;
    elapsed = 0;
    comboPopup = null;
  }

  function startGame(){
    resetPlayer();
    player.y = PIPE_TOP + INTRO_HIDDEN_DROP; // 土管の中、フチより下の見えない位置からスタート
    state = 'intro';
    introPhase = 'rise';
    introTimer = INTRO_RISE_MS;
    startOverlayEl.classList.add('hidden');
    goalOverlayEl.classList.add('hidden');
    pauseOverlayEl.classList.add('hidden');
    distTotalEl.textContent = Math.round(GOAL_X / 10);
  }

  function updateIntro(dt){
    introTimer -= dt * 1000;
    if(introPhase === 'rise'){
      // 土管のフチまでせり上がる(この間はフチより下をクリップして隠す)
      const progress = Math.min(1, 1 - Math.max(0, introTimer) / INTRO_RISE_MS);
      const eased = 1 - Math.pow(1 - progress, 2); // ease-out
      player.y = (PIPE_TOP + INTRO_HIDDEN_DROP) - INTRO_HIDDEN_DROP * eased;
      player.legPhase += dt * 3;
      if(introTimer <= 0){
        player.y = PIPE_TOP;
        introPhase = 'step';
        introTimer = INTRO_STEP_MS;
      }
    } else {
      // 土管の上から地面まで降りる(もうクリップは不要)
      const progress = Math.min(1, 1 - Math.max(0, introTimer) / INTRO_STEP_MS);
      const eased = progress * progress; // ease-in
      player.y = PIPE_TOP + (GROUND_BASE - PIPE_TOP) * eased;
      player.legPhase += dt * 6;
      if(introTimer <= 0){
        player.y = GROUND_BASE;
        state = 'play';
      }
    }
  }

  function togglePause(){
    if(state === 'play'){ state = 'paused'; pauseOverlayEl.classList.remove('hidden'); }
    else if(state === 'paused'){ state = 'play'; pauseOverlayEl.classList.add('hidden'); lastTime = performance.now(); }
  }

  function backToStart(){
    state = 'start';
    goalOverlayEl.classList.add('hidden');
    pauseOverlayEl.classList.add('hidden');
    startOverlayEl.classList.remove('hidden');
  }

  function updateResultFocus(){
    const focusables = [retryBtnEl, backToStartBtnEl];
    focusables.forEach((btn, i) => {
      btn.classList.toggle('gameover-selected', i === resultFocusIndex);
      btn.classList.toggle('gameover-unselected', i !== resultFocusIndex);
    });
  }

  function gameOver(reason){
    state = 'gameover';
    goalTitleEl.textContent = 'ゲームオーバー';
    goalStatsEl.textContent = reason;
    resultFocusIndex = 0;
    updateResultFocus();
    goalOverlayEl.classList.remove('hidden');
    crashFlashEl.style.transition = 'none';
    crashFlashEl.style.opacity = '0.5';
    requestAnimationFrame(() => {
      crashFlashEl.style.transition = 'opacity .4s';
      crashFlashEl.style.opacity = '0';
    });
  }

  function land(){
    const info = groundInfoAt(player.x);
    const groundAngle = info ? info.angle : 0;
    const velAngle = Math.atan2(player.vy, player.vx);
    let diffDeg = Math.abs((velAngle - groundAngle) * 180 / Math.PI);
    diffDeg = Math.min(diffDeg, 360 - diffDeg);

    const landedSpeed = Math.hypot(player.vx, player.vy);
    player.airborne = false;
    player.y = info ? info.y : player.y;
    player.angle = groundAngle;

    if(diffDeg <= LANDING_PERFECT_DEG){
      // perfect landing: speed boost
      player.speed = Math.min(MAX_SPEED, landedSpeed * 1.15);
      player.jumpStreak++;
    } else if(diffDeg <= LANDING_OK_DEG){
      player.speed = landedSpeed * 0.9;
      player.jumpStreak++;
    } else {
      // 着地が乱れても失速するだけ。クラッシュ演出(ダメージ)は出さない
      player.speed = landedSpeed * 0.65;
      player.jumpStreak = 0; // 着地が乱れるとコンボは途切れる
    }

    // 連続でジャンプの着地に成功するほど、加速にさらに加速が乗っていく
    if(player.jumpStreak >= 2){
      const bonus = 1 + Math.min(player.jumpStreak, STREAK_CAP) * STREAK_BONUS_PER;
      player.speed = Math.min(MAX_SPEED, player.speed * bonus);
      comboPopup = { text: 'コンボ ×' + player.jumpStreak + '!', timer: 900, maxTimer: 900 };
    }

    // 着地と同時にジャンプ入力があれば、タイミングを讃えて少し加速する
    if(heldActions.has('jump')){
      player.speed = Math.min(MAX_SPEED, player.speed * 1.08);
    }

    // すぐに再ジャンプすれば3段ジャンプに繋げられる猶予時間をセット
    player.chainTimer = CHAIN_WINDOW_MS;
  }

  function tryJump(){
    if(state !== 'play' || player.airborne) return;
    const info = groundInfoAt(player.x);
    const angle = info ? info.angle : 0;

    if(player.jumpChain > 0 && player.chainTimer > 0){
      player.jumpChain = Math.min(3, player.jumpChain + 1);
    } else {
      player.jumpChain = 1;
    }

    const impulseMul = JUMP_IMPULSE_LV[player.jumpChain - 1];
    playJumpVoice(player.jumpChain);
    player.airborne = true;
    player.vx = player.speed * Math.cos(angle);
    player.vy = player.speed * Math.sin(angle) - JUMP_IMPULSE * impulseMul;

    if(player.jumpChain >= 3){
      player.speed = Math.min(MAX_SPEED, player.speed * TRIPLE_JUMP_SPEED_BOOST);
      comboPopup = { text: '3段ジャンプ!!!', timer: 1100, maxTimer: 1100, big: true };
      player.jumpChain = 0; // マリオ64と同じく、3段の後は最初からやり直し
    }
  }

  function checkObstacleHit(){
    for(const ob of OBSTACLES){
      if(player.x + 9 < ob.x || player.x - 9 > ob.x + ob.w) continue;
      const info = groundInfoAt(Math.min(Math.max(player.x, ob.x), ob.x + ob.w));
      const groundY = info ? info.y : GROUND_BASE;
      const clearance = groundY - player.y; // how high above local ground the player currently is
      if(clearance < ob.h){
        gameOver('障害物にぶつかってしまった…');
        return true;
      }
    }
    return false;
  }

  function fallIntoPit(){
    gameOver('穴に落ちてしまった…');
  }

  function updatePlay(dt){
    elapsed += dt;
    const leanFwd = heldActions.has('leanForward');
    const leanBack = heldActions.has('leanBack');

    if(comboPopup){
      comboPopup.timer -= dt * 1000;
      if(comboPopup.timer <= 0) comboPopup = null;
    }

    if(!player.airborne){
      const info = groundInfoAt(player.x);
      if(info === null){
        // walked past the edge without jumping in time — start falling into the pit
        player.airborne = true;
        player.vx = player.speed;
        player.vy = 0;
      } else {
        player.y = info.y;
        player.angle = info.angle;

        // 一定速度で走り続ける。ジャンプの着地直後だけ一時的に速度がずれるので
        // 巡航速度へ滑らかに戻す(加速・ブレーキ操作はしなくてよい)
        player.speed += (CRUISE_SPEED - player.speed) * SPEED_RECOVERY * dt;
        player.x += player.speed * dt;
        player.legPhase = (player.legPhase + player.speed * dt * 0.05) % (Math.PI * 2);

        if(player.chainTimer > 0){
          player.chainTimer -= dt * 1000;
          if(player.chainTimer <= 0) player.jumpChain = 0; // 猶予切れで3段ジャンプの連鎖が途切れる
        }
      }
    }

    if(player.airborne){
      player.vy += GRAVITY * dt;
      if(leanFwd) player.angle += AIR_ROT_SPEED * dt;
      if(leanBack) player.angle -= AIR_ROT_SPEED * dt;
      player.x += player.vx * dt;
      player.y += player.vy * dt;
      player.legPhase += dt * 6;

      if(player.y > PIT_FALL_Y){ fallIntoPit(); return; }

      const info = groundInfoAt(player.x);
      if(info !== null && player.y >= info.y){
        land();
      }
    }

    if(state === 'play') checkObstacleHit();

    if(state === 'play' && player.x >= GOAL_X){
      player.x = GOAL_X;
      finishGoal();
    }

    camX = Math.max(0, player.x - 260);
    speedValEl.textContent = Math.round(player.speed * 0.18); // arbitrary km/h scaling
    distValEl.textContent = Math.round(player.x / 10);
    progressBarEl.style.width = Math.min(100, (player.x / GOAL_X) * 100) + '%';
  }

  function finishGoal(){
    state = 'goal';
    goalTitleEl.textContent = 'ゴール!';
    goalStatsEl.textContent = 'タイム: ' + elapsed.toFixed(2) + ' 秒';
    resultFocusIndex = 0;
    updateResultFocus();
    goalOverlayEl.classList.remove('hidden');
  }

  // ---------- Rendering ----------
  function drawGround(){
    ctx.fillStyle = '#5b3a1e';
    ctx.strokeStyle = '#3f2a15';
    ctx.lineWidth = 4;
    let drawing = false;
    ctx.beginPath();
    for(let i = 0; i < terrain.length; i++){
      const p = terrain[i];
      const sx = p.x - camX;
      if(!drawing){ ctx.moveTo(sx, p.y); drawing = true; }
      else ctx.lineTo(sx, p.y);
      if(p.gapAfter){
        // close and fill this ground chunk, start a new one after the gap
        ctx.lineTo(sx, 540);
        ctx.lineTo((terrain[i].x - camX), 540);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        drawing = false;
      }
    }
    if(drawing){
      const last = terrain[terrain.length - 1];
      ctx.lineTo(last.x - camX, 540);
      ctx.lineTo(terrain[0].x - camX, 540);
      ctx.closePath();
      ctx.fill();
    }
    // stroke the surface line separately (thin skin over each ground chunk)
    ctx.beginPath();
    drawing = false;
    for(let i = 0; i < terrain.length; i++){
      const p = terrain[i];
      const sx = p.x - camX;
      if(!drawing){ ctx.moveTo(sx, p.y); drawing = true; } else ctx.lineTo(sx, p.y);
      if(p.gapAfter){ ctx.stroke(); ctx.beginPath(); drawing = false; }
    }
    ctx.stroke();

    // goal flag
    const gx = GOAL_X - camX;
    ctx.fillStyle = '#fff';
    ctx.fillRect(gx - 2, GROUND_BASE - 90, 4, 90);
    ctx.fillStyle = '#C8481A';
    ctx.beginPath();
    ctx.moveTo(gx + 2, GROUND_BASE - 90);
    ctx.lineTo(gx + 34, GROUND_BASE - 76);
    ctx.lineTo(gx + 2, GROUND_BASE - 62);
    ctx.closePath();
    ctx.fill();
  }

  function drawObstacles(){
    ctx.fillStyle = '#6b6258';
    ctx.strokeStyle = '#3f3a33';
    ctx.lineWidth = 2;
    for(const ob of OBSTACLES){
      const info = groundInfoAt(ob.x + ob.w / 2);
      const baseY = info ? info.y : GROUND_BASE;
      const gx = ob.x - camX;
      ctx.beginPath();
      ctx.moveTo(gx, baseY);
      ctx.lineTo(gx + ob.w * 0.3, baseY - ob.h);
      ctx.lineTo(gx + ob.w * 0.7, baseY - ob.h);
      ctx.lineTo(gx + ob.w, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawPipe(){
    const gx = PIPE_X - camX;
    if(gx < -60 || gx > 1020) return;
    ctx.fillStyle = '#3ea62f';
    ctx.strokeStyle = '#245c1b';
    ctx.lineWidth = 3;
    const bodyTop = PIPE_TOP + PIPE_RIM_H;
    const bodyBottom = GROUND_BASE + 30;
    ctx.fillRect(gx - PIPE_W / 2 + 5, bodyTop, PIPE_W - 10, bodyBottom - bodyTop);
    ctx.strokeRect(gx - PIPE_W / 2 + 5, bodyTop, PIPE_W - 10, bodyBottom - bodyTop);
    ctx.fillRect(gx - PIPE_W / 2, PIPE_TOP, PIPE_W, PIPE_RIM_H + 4);
    ctx.strokeRect(gx - PIPE_W / 2, PIPE_TOP, PIPE_W, PIPE_RIM_H + 4);
  }

  function drawLegs(phase){
    // 走るモーション: 接地している脚は前→後ろへ蹴り、逆の脚は後ろ→前へ持ち上げて振り戻す
    const hip = { x: 0, y: -14 };
    const stride = 7, lift = 6;
    ctx.strokeStyle = '#e8dcc0';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    for(let i = 0; i < 2; i++){
      const p = phase + i * Math.PI;
      const fx = Math.cos(p) * stride;
      const fy = -Math.max(0, -Math.sin(p)) * lift;
      ctx.beginPath();
      ctx.moveTo(hip.x, hip.y);
      ctx.lineTo(fx, fy);
      ctx.stroke();
      ctx.fillStyle = '#8a6d3b';
      ctx.beginPath(); ctx.arc(fx, fy, 2.4, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawPlayer(){
    const sx = player.x - camX;
    const sy = player.y;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(player.angle);

    drawLegs(player.legPhase);

    // ニンニクマン本体(頭〜腰。脚は上のdrawLegsで表現するため画像下部はクロップ)
    if(charImg.complete && charImg.naturalWidth){
      const cw = 32, srcW = 379, srcH = 300; // 300/400 = 元画像の脚を除いた上半身部分
      const ch = cw * (srcH / srcW);
      const hipY = -14;
      ctx.drawImage(charImg, 0, 0, srcW, srcH, -cw/2, hipY - ch, cw, ch);
    } else {
      ctx.fillStyle = '#F5E7C6';
      ctx.strokeStyle = '#C8481A';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, -33, 11, 13, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0, 0, 960, 540);
    // sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, 540);
    grad.addColorStop(0, '#6fc1ef');
    grad.addColorStop(1, '#bfe8ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 960, 540);

    drawGround();
    drawObstacles();
    drawPipe();

    if(state === 'intro' && introPhase === 'rise'){
      // 土管のフチまでせり上がる途中は、フチより下の部分をクリップして隠す
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, 960, PIPE_TOP);
      ctx.clip();
      drawPlayer();
      ctx.restore();
    } else {
      drawPlayer();
    }

    drawComboPopup();
  }

  function drawComboPopup(){
    if(!comboPopup || comboPopup.timer <= 0) return;
    const t = Math.max(0, comboPopup.timer / comboPopup.maxTimer);
    const big = !!comboPopup.big;
    const sx = player.x - camX;
    const sy = player.y - (big ? 76 : 68) - (1 - t) * (big ? 28 : 18);
    ctx.save();
    ctx.globalAlpha = Math.min(1, t * 2);
    ctx.font = 'bold ' + (big ? 26 : 18) + 'px "Yu Gothic", Meiryo, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = big ? 4 : 3;
    ctx.strokeStyle = big ? '#8a1f0a' : '#5b3a1e';
    ctx.fillStyle = big ? '#FFD23F' : '#F3980D';
    ctx.strokeText(comboPopup.text, sx, sy);
    ctx.fillText(comboPopup.text, sx, sy);
    ctx.restore();
  }

  // ---------- Main loop ----------
  function loop(now){
    if(!lastTime) lastTime = now;
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;

    if(state === 'play') updatePlay(dt);
    else if(state === 'intro') updateIntro(dt);

    draw();
    requestAnimationFrame(loop);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  retryBtnEl.addEventListener('click', startGame);
  backToStartBtnEl.addEventListener('click', backToStart);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);

  // ---------- タッチ操作(スマホ向け) ----------
  const isTouchDevice = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  if(isTouchDevice){
    tcLeanBackEl.classList.add('show');
    tcLeanFwdEl.classList.add('show');
    tcHintEl.classList.add('show');
  }
  function bindHoldButton(el, action){
    const press = (e) => { e.preventDefault(); heldActions.add(action); };
    const release = (e) => { if(e) e.preventDefault(); heldActions.delete(action); };
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release);
    el.addEventListener('touchcancel', release);
  }
  bindHoldButton(tcLeanBackEl, 'leanBack');
  bindHoldButton(tcLeanFwdEl, 'leanForward');
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    tryJump();
  }, { passive: false });

  resetPlayer();
  distTotalEl.textContent = Math.round(GOAL_X / 10);
  fitToWindow();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>走れニンニクマン(開発中)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3E7;
    --panel:#FFFFFF;
    --ink:#4A3B2D;
    --outline:#8C7C6E;
    --outline-dark:#5B4C3E;
    --golden:#F3980D;
    --terracotta:#C8481A;
    --ivory:#FBEFD9;
    --taupe:#B7A499;
    --shadow: rgba(74,59,45,0.18);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--cream);
    font-family:'Zen Maru Gothic', sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    background-image:
      radial-gradient(circle at 8% 12%, rgba(243,152,13,0.10) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(200,72,26,0.08) 0, transparent 45%);
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    height:100dvh;
  }
  #wrap{
    width: max-content;
    flex-shrink: 0;
    margin: 0 auto;
    padding: 18px 14px calc(24px + env(safe-area-inset-bottom));
    transform-origin: center center;
  }
  header{ display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:14px; }
  html.popup-mode header{ display:none; }
  header img{ width:52px; height:auto; filter: drop-shadow(0 3px 0 var(--shadow)); }
  h1{
    font-size: clamp(22px, 4vw, 30px);
    font-weight:900;
    margin:0;
    letter-spacing: 0.02em;
    color: var(--terracotta);
    text-shadow: 2px 2px 0 var(--ivory), -1px -1px 0 var(--ivory), 1px -1px 0 var(--ivory), -1px 1px 0 var(--ivory);
  }
  .board-shell{
    background: var(--panel);
    border: 4px solid var(--outline-dark);
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 8px 0 var(--shadow);
    touch-action: none;
  }
  .canvas-area{ position:relative; }
  canvas{ display:block; width:960px; height:540px; background:#8fd0f2; border-radius:10px; touch-action:none; }
  #buttonPanel{ margin-top:10px; }
  #hud{ position:absolute; top:20px; left:20px; right:20px; display:flex; justify-content:space-between; pointer-events:none; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); font-size:15px; font-weight:bold; }
  #hud .box{ background:rgba(0,0,0,.35); padding:6px 12px; border-radius:8px; }
  #timeHud{ position:absolute; top:54px; right:20px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); font-size:15px; font-weight:bold; pointer-events:none; }
  button{ font-family:'Zen Maru Gothic', sans-serif; cursor:pointer; }
  .btn{
    background: var(--golden);
    border: 3px solid var(--outline-dark);
    color: #fff;
    font-weight: 700;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    box-shadow: 0 4px 0 var(--outline-dark);
    transition: transform 0.05s ease;
    width:100%;
  }
  .btn:active{ transform: translateY(3px); box-shadow: 0 1px 0 var(--outline-dark); }
  .btn.secondary{ background: var(--panel); color: var(--terracotta); }
  .btn-row{ display:flex; gap:8px; }
  .touchBtn{ position:absolute; width:64px; height:64px; border-radius:50%; background:var(--panel); border:3px solid var(--outline-dark); color:var(--terracotta); font-size:24px; font-weight:900; display:none; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; touch-action:none; box-shadow: 0 4px 0 var(--outline-dark); }
  .touchBtn.show{ display:flex; }
  .touchBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--outline-dark); }
  #tcLeanBack{ left:16px; bottom:96px; }
  #tcLeanFwd{ left:16px; bottom:16px; }
  #tcHint{ position:absolute; bottom:20px; right:16px; color:#4a2c0f; background:rgba(255,255,255,.85); border-radius:8px; padding:4px 10px; font-size:12px; font-weight:bold; display:none; }
  #tcHint.show{ display:block; }
  #soundToggleBtn{ position:absolute; top:16px; left:710px; width:34px; height:34px; border-radius:50%; background:var(--panel); border:2px solid var(--outline-dark); color:var(--terracotta); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  #versionLabel{ position:absolute; bottom:14px; right:14px; color:rgba(255,255,255,.7); font-size:11px; font-weight:bold; text-shadow:0 1px 2px rgba(0,0,0,.5); pointer-events:none; }
  .overlay{ position:absolute; inset:0; background: var(--cream); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:16px; z-index:5; }
  .overlay.hidden{ display:none; }
  .overlay-card{ display:flex; flex-direction:column; align-items:stretch; gap:10px; width:300px; }
  .overlay-card h1{ margin:0; font-size:20px; color: var(--terracotta); font-weight:900; text-align:center; text-shadow:none; }
  .overlay-card p{ margin:0; font-size:13px; font-weight:500; color: var(--ink); text-align:center; }
  .overlay-mascot{ width:90px; height:auto; align-self:center; filter: drop-shadow(0 4px 0 var(--shadow)); }
  .btn.wide{ width:100%; box-sizing:border-box; }
  .hidden{ display:none !important; }
  #scoreSubmit{ display:flex; flex-direction:column; gap:10px; }
  .gameover-selected{ background: var(--golden) !important; color:#fff !important; box-shadow: 0 4px 0 var(--outline-dark) !important; }
  .gameover-unselected{ background: var(--panel) !important; color: var(--terracotta) !important; box-shadow: 0 4px 0 var(--outline-dark) !important; }
  #nameInput{ font-family:'Zen Maru Gothic', sans-serif; width:100%; box-sizing:border-box; padding:9px 12px; border-radius:10px; border:3px solid var(--outline-dark); font-size:14px; text-align:center; color: var(--ink); }
  #rankResultText{ margin:0; font-size:14px; color: var(--terracotta); font-weight:900; }
  #rankingEntries{ list-style:none; margin:0; padding:0; width:100%; max-height:400px; overflow-y:auto; text-align:left; }
  #rankingEntries li{ display:flex; align-items:center; gap:10px; padding:10px 6px; font-size:16px; border-bottom:1px solid rgba(140,124,110,0.25); }
  #rankingEntries li:nth-child(even){ background: rgba(243,152,13,0.06); }
  #rankingEntries li:last-child{ border-bottom:none; }
  .rank-no{ width:2.6em; font-weight:900; color: var(--terracotta); flex-shrink:0; text-align:center; font-size:15px; }
  .rank-gold{ color:#C8481A; }
  .rank-silver{ color:#8C7C6E; }
  .rank-bronze{ color:#B7792F; }
  .rank-name{ flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; color: var(--ink); }
  .rank-val{ font-weight:900; color: var(--terracotta); flex-shrink:0; font-variant-numeric: tabular-nums; }
  .rank-empty{ justify-content:center; text-align:center; color: var(--taupe); padding:14px 0; }
  #progressWrap{ position:absolute; bottom:8px; left:8px; right:8px; height:8px; background:rgba(0,0,0,.2); border-radius:6px; overflow:hidden; }
  #progressBar{ height:100%; width:0%; background:linear-gradient(90deg,var(--golden),var(--terracotta)); }
  #crashFlash{ position:absolute; inset:0; background:#ff0000; opacity:0; pointer-events:none; border-radius:10px; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <img id="headerMascotImg" alt="ニンニクマン">
    <h1>走れニンニクマン</h1>
  </header>

  <div class="board-shell">
    <div class="canvas-area">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="hud">
        <div class="box">速度: <span id="speedVal">0</span> km/h</div>
        <div class="box">距離: <span id="distVal">0</span> / <span id="distTotal">0</span> m</div>
      </div>
      <div id="timeHud" class="box">タイム: <span id="timeVal">0.00</span> 秒</div>
      <div id="progressWrap"><div id="progressBar"></div></div>
      <div id="crashFlash"></div>
      <button class="touchBtn" id="tcLeanBack" type="button">↑</button>
      <button class="touchBtn" id="tcLeanFwd" type="button">↓</button>
      <div id="tcHint">タップでジャンプ</div>
      <button id="soundToggleBtn" type="button" title="効果音のON/OFF">🔊</button>
      <div id="versionLabel">v0.1.0</div>

      <div id="startOverlay" class="overlay">
        <div class="overlay-card">
          <h1>走れニンニクマン</h1>
          <p>自動走行、操作不要!<br>Space/タップ: ジャンプ(穴・障害物に注意)<br>↑↓: 空中姿勢制御(着地で加減速)</p>
          <button class="btn wide" id="startBtn">スタート [Enter]</button>
        </div>
      </div>

      <div id="goalOverlay" class="overlay hidden">
        <div class="overlay-card">
          <img class="overlay-mascot" id="overlayMascotImg" alt="ニンニクマン">
          <h1 id="goalTitle">ゴール!</h1>
          <p id="goalStats"></p>
          <div id="scoreSubmit" class="hidden">
            <p id="rankResultText" class="hidden"></p>
            <input id="nameInput" type="text" maxlength="12" placeholder="なまえ(12文字まで)">
            <button class="btn wide" id="submitScoreBtn">ランキングに登録</button>
            <button class="btn secondary wide" id="shareScoreBtn">Xでシェア</button>
          </div>
          <button class="btn secondary wide" id="retryBtn">もう一度</button>
          <button class="btn secondary wide" id="backToStartBtn">スタートに戻る</button>
        </div>
      </div>

      <div id="rankingOverlay" class="overlay hidden">
        <div class="overlay-card" style="width:640px;">
          <h1>ランキング</h1>
          <ul id="rankingEntries"></ul>
          <button class="btn wide" id="closeRankingBtn">とじる</button>
        </div>
      </div>

      <div id="pauseOverlay" class="overlay hidden">
        <div class="overlay-card">
          <h1>PAUSE</h1>
          <button class="btn wide" id="resumeBtn">再開 [P]</button>
        </div>
      </div>
    </div>

    <div id="buttonPanel">
      <div class="btn-row">
        <button class="btn secondary" id="pauseBtn">一時停止 [P]</button>
        <button class="btn secondary" id="restartBtn">やり直す [R]</button>
        <button class="btn secondary" id="rankingBtn">ランキング [L]</button>
        <button class="btn secondary" id="popupBtn">ポップアップ化 [O]</button>
      </div>
    </div>
  </div>
</div>

          keyBindings[a] = [
            (typeof v[0] === 'string' || v[0] === null) ? v[0] : DEFAULT_KEYS[a][0],
            (typeof v[1] === 'string' || v[1] === null) ? v[1] : null,
          ];
        }
      });
    }catch(e){ keyBindings = cloneKeys(DEFAULT_KEYS); }
  }
  function actionForCode(code){
    for(const a of KEY_ACTIONS){ if(keyBindings[a].includes(code)) return a; }
    return null;
  }
  loadKeyBindings();

  const heldActions = new Set();
  window.addEventListener('keydown', (e) => {
    if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if(!rankingOverlayEl.classList.contains('hidden')){
      if(e.code === 'Escape' || e.code === 'Enter' || e.code === 'Space'){ e.preventDefault(); closeRanking(); }
      return;
    }
    const action = actionForCode(e.code);
    if(action){ e.preventDefault(); heldActions.add(action); }
    if(action === 'pause'){ togglePause(); }
    if(action === 'jump' && !e.repeat){ tryJump(); }
    if(e.code === 'Escape' && state !== 'start'){ backToStart(); }
    if(e.code === 'KeyR'){ document.getElementById('restartBtn').click(); }
    if(e.code === 'KeyL'){ document.getElementById('rankingBtn').click(); }
    if(e.code === 'KeyO'){ document.getElementById('popupBtn').click(); }
    if(!goalOverlayEl.classList.contains('hidden')){
      const focusables = getResultFocusables();
      if(e.code === 'ArrowLeft' || e.code === 'ArrowUp'){ resultFocusIndex = (resultFocusIndex - 1 + focusables.length) % focusables.length; updateResultFocus(); }
      if(e.code === 'ArrowRight' || e.code === 'ArrowDown'){ resultFocusIndex = (resultFocusIndex + 1) % focusables.length; updateResultFocus(); }
    }
    if(e.code === 'Enter' || e.code === 'Space'){
      if(!startOverlayEl.classList.contains('hidden')){ startGame(); }
      else if(!goalOverlayEl.classList.contains('hidden')){
        // ゴール/ゲームオーバー直後は、ジャンプの連打でそのまま結果画面を
        // 見ずに次へ進んでしまわないよう、少しの間だけ確定操作を無視する
        if(performance.now() < resultInputLockUntil) return;
        getResultFocusables()[resultFocusIndex].click();
      }
    }
  });
  window.addEventListener('keyup', (e) => {
    const action = actionForCode(e.code);
    if(action){ heldActions.delete(action); }
  });

  // ---------- Terrain (固定コース、500m) ----------
  // Points define a ground polyline. gapAfter:true means there is NO ground
  // between this point and the next (a pit/ramp gap the player must jump).
  // 各ジャンプ台は dx=250,dy=-30 の登り坂で統一(巡航速度300px/s・ジャンプ初速420px/s
  // だと安全に180px前後まで届く実測値)、穴の幅は余裕を見て140pxに統一。
  const GROUND_BASE = 400;
  const COURSE_LENGTH = 5000; // 500m (距離表示は x/10 メートル)
  const GOAL_X = COURSE_LENGTH;
  const terrain = [
    { x: 0,    y: GROUND_BASE },
    { x: 500,  y: GROUND_BASE },       // 平坦なスタート区間
    { x: 800,  y: GROUND_BASE + 60 },
    { x: 1100, y: GROUND_BASE - 10 },
    { x: 1350, y: GROUND_BASE - 40, gapAfter: true }, // ジャンプ台1
    { x: 1490, y: GROUND_BASE - 10 },
    { x: 1800, y: GROUND_BASE + 10 },
    { x: 2100, y: GROUND_BASE - 60 },
    { x: 2400, y: GROUND_BASE + 10 },
    { x: 2650, y: GROUND_BASE - 20 },
    { x: 2900, y: GROUND_BASE - 50, gapAfter: true }, // ジャンプ台2
    { x: 3040, y: GROUND_BASE - 20 },
    { x: 3350, y: GROUND_BASE + 40 },
    { x: 3650, y: GROUND_BASE + 10 },
    { x: 3900, y: GROUND_BASE - 20, gapAfter: true }, // ジャンプ台3
    { x: 4040, y: GROUND_BASE + 10 },
    { x: 4350, y: GROUND_BASE },
    { x: 4550, y: GROUND_BASE },       // 平坦なゴール前区間
    { x: 5000, y: GROUND_BASE },       // goal
  ];
  const OBSTACLES = [
    { x: 650,  w: 26, h: 24 },
    { x: 1950, w: 28, h: 24 },
    { x: 2500, w: 24, h: 22 },
    { x: 3500, w: 30, h: 26 },
    { x: 4200, w: 24, h: 22 },
  ];

  function findSegment(x){
    for(let i = 0; i < terrain.length - 1; i++){
      if(x >= terrain[i].x && x <= terrain[i+1].x) return i;
    }
    return x < terrain[0].x ? 0 : terrain.length - 2;
  }

  // Returns {y, angle} of ground at x, or null if x is inside a gap (no ground).
  function groundInfoAt(x){
    const i = findSegment(x);
    const a = terrain[i], b = terrain[i+1];
    if(a.gapAfter) return null;
    const t = (x - a.x) / (b.x - a.x);
    const y = a.y + (b.y - a.y) * t;
    const angle = Math.atan2(b.y - a.y, b.x - a.x);
    return { y, angle };
  }

  // ---------- Physics constants ----------
  // 走れニンニクマンは一定速度で自動的に走り続けるゲームなので、加速・ブレーキ操作は無い。
  // プレイヤーが操作するのはジャンプのタイミングと、空中での姿勢(着地角度)のみ。
  const GRAVITY = 1500;          // px/s^2
  const CRUISE_SPEED = 300;      // px/s — 常にこの速度で走り続ける(操作不要)
  const SPEED_RECOVERY = 2.2;    // ジャンプ後の速度が巡航速度へ戻る速さ
  const AIR_ROT_SPEED = 2.6;     // rad/s bike rotation control while airborne
  const MAX_SPEED = 900;         // px/s
  const JUMP_IMPULSE = 420;      // upward kick from a manual jump (px/s)
  const PIT_FALL_Y = 640;        // falling past this = missed the jump, into the pit
  const LANDING_PERFECT_DEG = 10;
  const LANDING_OK_DEG = 30;
  const STREAK_BONUS_PER = 0.05; // 連続で着地に成功するたびに+5%ずつ加速が乗る
  const STREAK_CAP = 8;          // 最大+40%まで(それ以上は頭打ち)

  // マリオ64風の3段ジャンプ: 着地してすぐ(CHAIN_WINDOW_MS以内に)再ジャンプすると
  // 段数が上がってジャンプが高くなり、3段目でめっちゃ加速する。段数はそこでリセット。
  const CHAIN_WINDOW_MS = 300;
  const FAST_CHAIN_MS = 80; // これより速く再ジャンプできたら「最速フレーム」扱いで砂煙を出さない
  const JUMP_IMPULSE_LV = [1, 1.3, 1.7];
  const TRIPLE_JUMP_SPEED_BOOST = 1.6;

  // ---------- Intro (マリオ風の土管から登場する演出) ----------
  const PIPE_X = 60;
  const PIPE_W = 46;
  const PIPE_RIM_H = 10;
  const PIPE_HEIGHT = 34;             // 地面から突き出ている土管の高さ
  const PIPE_TOP = GROUND_BASE - PIPE_HEIGHT;
  const INTRO_HIDDEN_DROP = 50;       // 土管の中(フチより下)の隠れた開始位置
  const INTRO_RISE_MS = 550;          // 第1段階: 土管のフチまでせり上がる
  const INTRO_STEP_MS = 250;          // 第2段階: 地面まで降りる

  // ---------- Game state ----------
  let state = 'start'; // 'start' | 'intro' | 'play' | 'paused' | 'goal' | 'gameover'
  let player, camX, elapsed, lastTime, introTimer, introPhase;
  let resultFocusIndex = 0; // 0 = もう一度, 1 = スタートに戻る (goal/gameover画面での選択)
  let resultInputLockUntil = 0; // この時刻までは結果画面のEnter/Space確定を無視する
  let comboPopup = null; // { text, timer, maxTimer } — 連続ジャンプ成功時に浮かぶ表示
  let dustPuffs = []; // 最速で3段ジャンプを繋げられなかった時に足元へ出す砂煙

  function resetPlayer(){
    player = {
      x: PIPE_X, y: GROUND_BASE, angle: 0, // 土管の位置から出てくるので、開始xを土管に合わせる
      speed: CRUISE_SPEED, // scalar forward speed while grounded
      vx: 0, vy: 0,        // used only while airborne
      airborne: false,
      legPhase: 0,
      jumpStreak: 0,
      jumpChain: 0,
      chainTimer: 0,
      lastLandTime: 0,
      pendingDustLand: false,
    };
    camX = 0;
    elapsed = 0;
    comboPopup = null;
    dustPuffs = [];
  }

  function startGame(){
    resetPlayer();
    player.y = PIPE_TOP + INTRO_HIDDEN_DROP; // 土管の中、フチより下の見えない位置からスタート
    state = 'intro';
    introPhase = 'rise';
    introTimer = INTRO_RISE_MS;
    startOverlayEl.classList.add('hidden');
    goalOverlayEl.classList.add('hidden');
    pauseOverlayEl.classList.add('hidden');
    hideScoreSubmit();
    distTotalEl.textContent = Math.round(GOAL_X / 10);
    timeValEl.textContent = '0.00';
  }

  function updateIntro(dt){
    introTimer -= dt * 1000;
    if(introPhase === 'rise'){
      // 土管のフチまでせり上がる(この間はフチより下をクリップして隠す)
      const progress = Math.min(1, 1 - Math.max(0, introTimer) / INTRO_RISE_MS);
      const eased = 1 - Math.pow(1 - progress, 2); // ease-out
      player.y = (PIPE_TOP + INTRO_HIDDEN_DROP) - INTRO_HIDDEN_DROP * eased;
      player.legPhase += dt * 3;
      if(introTimer <= 0){
        player.y = PIPE_TOP;
        introPhase = 'step';
        introTimer = INTRO_STEP_MS;
      }
    } else {
      // 土管の上から地面まで降りる(もうクリップは不要)
      const progress = Math.min(1, 1 - Math.max(0, introTimer) / INTRO_STEP_MS);
      const eased = progress * progress; // ease-in
      player.y = PIPE_TOP + (GROUND_BASE - PIPE_TOP) * eased;
      player.legPhase += dt * 6;
      if(introTimer <= 0){
        player.y = GROUND_BASE;
        state = 'play';
      }
    }
  }

  function togglePause(){
    if(state === 'play'){ state = 'paused'; pauseOverlayEl.classList.remove('hidden'); }
    else if(state === 'paused'){ state = 'play'; pauseOverlayEl.classList.add('hidden'); lastTime = performance.now(); }
  }

  function backToStart(){
    state = 'start';
    goalOverlayEl.classList.add('hidden');
    pauseOverlayEl.classList.add('hidden');
    startOverlayEl.classList.remove('hidden');
  }

  function getResultFocusables(){
    return scoreSubmitEl.classList.contains('hidden')
      ? [retryBtnEl, backToStartBtnEl]
      : [submitScoreBtnEl, shareScoreBtnEl, retryBtnEl, backToStartBtnEl];
  }

  function updateResultFocus(){
    const focusables = getResultFocusables();
    focusables.forEach((btn, i) => {
      btn.classList.toggle('gameover-selected', i === resultFocusIndex);
      btn.classList.toggle('gameover-unselected', i !== resultFocusIndex);
    });
  }

  function gameOver(reason){
    state = 'gameover';
    goalTitleEl.textContent = 'ゲームオーバー';
    goalStatsEl.textContent = reason;
    hideScoreSubmit();
    resultFocusIndex = 0;
    updateResultFocus();
    resultInputLockUntil = performance.now() + 600;
    goalOverlayEl.classList.remove('hidden');
    crashFlashEl.style.transition = 'none';
    crashFlashEl.style.opacity = '0.5';
    requestAnimationFrame(() => {
      crashFlashEl.style.transition = 'opacity .4s';
      crashFlashEl.style.opacity = '0';
    });
  }

  function land(){
    const info = groundInfoAt(player.x);
    const groundAngle = info ? info.angle : 0;
    const velAngle = Math.atan2(player.vy, player.vx);
    let diffDeg = Math.abs((velAngle - groundAngle) * 180 / Math.PI);
    diffDeg = Math.min(diffDeg, 360 - diffDeg);

    const landedSpeed = Math.hypot(player.vx, player.vy);
    player.airborne = false;
    player.y = info ? info.y : player.y;
    player.angle = groundAngle;

    if(diffDeg <= LANDING_PERFECT_DEG){
      // perfect landing: speed boost
      player.speed = Math.min(MAX_SPEED, landedSpeed * 1.15);
      player.jumpStreak++;
    } else if(diffDeg <= LANDING_OK_DEG){
      player.speed = landedSpeed * 0.9;
      player.jumpStreak++;
    } else {
      // 着地が乱れても失速するだけ。クラッシュ演出(ダメージ)は出さない
      player.speed = landedSpeed * 0.65;
      player.jumpStreak = 0; // 着地が乱れるとコンボは途切れる
    }

    // 連続でジャンプの着地に成功するほど、加速にさらに加速が乗っていく
    if(player.jumpStreak >= 2){
      const bonus = 1 + Math.min(player.jumpStreak, STREAK_CAP) * STREAK_BONUS_PER;
      player.speed = Math.min(MAX_SPEED, player.speed * bonus);
      comboPopup = { text: 'コンボ ×' + player.jumpStreak + '!', timer: 900, maxTimer: 900 };
    }

    // 着地と同時にジャンプ入力があれば、タイミングを讃えて少し加速する
    if(heldActions.has('jump')){
      player.speed = Math.min(MAX_SPEED, player.speed * 1.08);
    }

    // 砂煙はすぐには出さず、FAST_CHAIN_MSの間ジャンプが来なければ出す(予約方式)。
    // 先に出してから取り消す方式だと、取り消しが届くまでの数フレームは
    // 必ず描画されてしまい一瞬チラつくため、この順番にしている。
    player.pendingDustLand = true;
    player.lastLandTime = performance.now();

    // すぐに再ジャンプすれば3段ジャンプに繋げられる猶予時間をセット
    player.chainTimer = CHAIN_WINDOW_MS;
  }

  function tryJump(){
    if(state !== 'play' || player.airborne) return;
    const info = groundInfoAt(player.x);
    const angle = info ? info.angle : 0;

    // 最速フレームで再ジャンプできたので、予約していた着地の砂煙は出さない
    player.pendingDustLand = false;

    if(player.jumpChain > 0 && player.chainTimer > 0){
      player.jumpChain = Math.min(3, player.jumpChain + 1);
    } else {
      player.jumpChain = 1;
    }

    const impulseMul = JUMP_IMPULSE_LV[player.jumpChain - 1];
    playJumpVoice(player.jumpChain);
    player.airborne = true;
    player.vx = player.speed * Math.cos(angle);
    player.vy = player.speed * Math.sin(angle) - JUMP_IMPULSE * impulseMul;

    if(player.jumpChain >= 3){
      player.speed = Math.min(MAX_SPEED, player.speed * TRIPLE_JUMP_SPEED_BOOST);
      comboPopup = { text: '3段ジャンプ!!!', timer: 1100, maxTimer: 1100, big: true };
      player.jumpChain = 0; // マリオ64と同じく、3段の後は最初からやり直し
    }
  }

  function checkObstacleHit(){
    for(const ob of OBSTACLES){
      if(player.x + 9 < ob.x || player.x - 9 > ob.x + ob.w) continue;
      const info = groundInfoAt(Math.min(Math.max(player.x, ob.x), ob.x + ob.w));
      const groundY = info ? info.y : GROUND_BASE;
      const clearance = groundY - player.y; // how high above local ground the player currently is
      if(clearance < ob.h){
        gameOver('障害物にぶつかってしまった…');
        return true;
      }
    }
    return false;
  }

  function fallIntoPit(){
    gameOver('穴に落ちてしまった…');
  }

  function updatePlay(dt){
    elapsed += dt;
    const leanFwd = heldActions.has('leanForward');
    const leanBack = heldActions.has('leanBack');

    if(comboPopup){
      comboPopup.timer -= dt * 1000;
      if(comboPopup.timer <= 0) comboPopup = null;
    }
    for(let i = dustPuffs.length - 1; i >= 0; i--){
      const d = dustPuffs[i];
      d.life -= dt * 1000;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.vy += 40 * dt;
      if(d.life <= 0) dustPuffs.splice(i, 1);
    }

    if(!player.airborne){
      const info = groundInfoAt(player.x);
      if(info === null){
        // walked past the edge without jumping in time — start falling into the pit
        player.airborne = true;
        player.vx = player.speed;
        player.vy = 0;
      } else {
        player.y = info.y;
        player.angle = info.angle;

        // 一定速度で走り続ける。ジャンプの着地直後だけ一時的に速度がずれるので
        // 巡航速度へ滑らかに戻す(加速・ブレーキ操作はしなくてよい)
        player.speed += (CRUISE_SPEED - player.speed) * SPEED_RECOVERY * dt;
        player.x += player.speed * dt;
        player.legPhase = (player.legPhase + player.speed * dt * 0.05) % (Math.PI * 2);

        if(player.chainTimer > 0){
          player.chainTimer -= dt * 1000;
          if(player.chainTimer <= 0) player.jumpChain = 0; // 猶予切れで3段ジャンプの連鎖が途切れる
        }

        // 最速フレームで再ジャンプが来ないまま予約時間が過ぎたら、ここで初めて砂煙を出す
        if(player.pendingDustLand && performance.now() - player.lastLandTime >= FAST_CHAIN_MS){
          spawnDustPuff(player.x, player.y);
          player.pendingDustLand = false;
        }
      }
    }

    if(player.airborne){
      player.vy += GRAVITY * dt;
      if(leanFwd) player.angle += AIR_ROT_SPEED * dt;
      if(leanBack) player.angle -= AIR_ROT_SPEED * dt;
      player.x += player.vx * dt;
      player.y += player.vy * dt;
      player.legPhase += dt * 6;

      if(player.y > PIT_FALL_Y){ fallIntoPit(); return; }

      const info = groundInfoAt(player.x);
      if(info !== null && player.y >= info.y){
        land();
      }
    }

    if(state === 'play') checkObstacleHit();

    if(state === 'play' && player.x >= GOAL_X){
      player.x = GOAL_X;
      finishGoal();
    }

    camX = Math.max(0, player.x - 260);
    speedValEl.textContent = Math.round(player.speed * 0.18); // arbitrary km/h scaling
    distValEl.textContent = Math.round(player.x / 10);
    timeValEl.textContent = elapsed.toFixed(2);
    progressBarEl.style.width = Math.min(100, (player.x / GOAL_X) * 100) + '%';
  }

  // ---------- ランキング(一時的にtetris_ninniku.htmlと同じ構成で追加) ----------
  const RANKING_FILE = 'ranking-clear.json';
  // Cloudflare Workerを経由してGitHub Issue化し、GitHub Actionsでranking-clear.jsonを更新する。
  // Worker未デプロイの間は登録に失敗するだけで、閲覧(ランキング表示)は空一覧として動作する。
  const RANKING_SUBMIT_URL = 'https://ninniku-chari.rapidpredict.workers.dev/';
  let pendingSubmit = null;

  function formatClearTime(ms){
    const totalMs = Math.round(ms);
    const m = Math.floor(totalMs / 60000);
    const s = Math.floor((totalMs % 60000) / 1000);
    const cs = Math.floor((totalMs % 1000) / 10);
    return (m > 0 ? m + ':' + String(s).padStart(2, '0') : s) + '.' + String(cs).padStart(2, '0');
  }

  async function fetchRanking(){
    try{
      const res = await fetch(RANKING_FILE, { cache: 'no-store' });
      if(!res.ok) return null;
      const list = await res.json();
      return Array.isArray(list) ? list : [];
    }catch(e){ return null; }
  }

  async function checkAndShowRank(valueMs){
    rankResultTextEl.textContent = '順位を確認中…';
    rankResultTextEl.classList.remove('hidden');
    const list = await fetchRanking();
    if(!pendingSubmit || pendingSubmit.value !== valueMs) return;
    if(list === null){
      rankResultTextEl.classList.add('hidden');
      return;
    }
    let rank = list.findIndex(e => valueMs < e.value);
    if(rank === -1) rank = list.length;
    rank += 1;
    rankResultTextEl.textContent = '現在の順位: ' + rank + '位';
  }

  async function renderRankingList(){
    rankingEntriesEl.innerHTML = '';
    const loadingLi = document.createElement('li');
    loadingLi.textContent = '読み込み中…';
    loadingLi.className = 'rank-empty';
    rankingEntriesEl.appendChild(loadingLi);
    const list = await fetchRanking();
    rankingEntriesEl.innerHTML = '';
    if(list === null){
      const li = document.createElement('li');
      li.textContent = 'ランキングを取得できませんでした';
      li.className = 'rank-empty';
      rankingEntriesEl.appendChild(li);
      return;
    }
    if(list.length === 0){
      const li = document.createElement('li');
      li.textContent = 'まだ記録がありません';
      li.className = 'rank-empty';
      rankingEntriesEl.appendChild(li);
      return;
    }
    list.forEach((e, i) => {
      const li = document.createElement('li');
      const medalClass = i === 0 ? ' rank-gold' : i === 1 ? ' rank-silver' : i === 2 ? ' rank-bronze' : '';
      const noSpan = document.createElement('span');
      noSpan.className = 'rank-no' + medalClass;
      noSpan.textContent = (i + 1) + '位';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'rank-name';
      nameSpan.textContent = e.name || '名無しさん';
      const valSpan = document.createElement('span');
      valSpan.className = 'rank-val';
      valSpan.textContent = formatClearTime(e.value);
      li.append(noSpan, nameSpan, valSpan);
      rankingEntriesEl.appendChild(li);
    });
  }

  let rankingReturnToPlay = false;
  function openRanking(){
    if(state === 'play'){ state = 'paused'; rankingReturnToPlay = true; }
    else { rankingReturnToPlay = false; }
    rankingOverlayEl.classList.remove('hidden');
    renderRankingList();
  }
  function closeRanking(){
    rankingOverlayEl.classList.add('hidden');
    if(rankingReturnToPlay){ state = 'play'; lastTime = performance.now(); rankingReturnToPlay = false; }
  }

  function showScoreSubmit(valueMs){
    pendingSubmit = { value: valueMs };
    let savedName = '';
    try{ savedName = localStorage.getItem('ninniku-chari-playername') || ''; }catch(e){ /* ignore */ }
    nameInputEl.value = savedName;
    submitScoreBtnEl.textContent = 'ランキングに登録';
    submitScoreBtnEl.disabled = false;
    shareScoreBtnEl.textContent = 'Xでシェア';
    scoreSubmitEl.classList.remove('hidden');
  }
  function hideScoreSubmit(){
    pendingSubmit = null;
    scoreSubmitEl.classList.add('hidden');
  }

  submitScoreBtnEl.addEventListener('click', async () => {
    if(!pendingSubmit) return;
    let name = nameInputEl.value.replace(/[\r\n]/g, '').trim().slice(0, 12);
    if(!name) name = '名無しさん';
    try{ localStorage.setItem('ninniku-chari-playername', name); }catch(e){ /* ignore */ }
    const { value } = pendingSubmit;
    submitScoreBtnEl.disabled = true;
    submitScoreBtnEl.textContent = '登録中…';
    try{
      const res = await fetch(RANKING_SUBMIT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'clear', value, name }),
      });
      const data = await res.json().catch(() => null);
      if(res.ok && data && data.ok){
        submitScoreBtnEl.textContent = '登録しました！反映まで少々お待ちください';
      } else {
        submitScoreBtnEl.textContent = '登録に失敗しました。もう一度お試しください';
        submitScoreBtnEl.disabled = false;
      }
    }catch(e){
      submitScoreBtnEl.textContent = '登録に失敗しました(通信エラー)';
      submitScoreBtnEl.disabled = false;
    }
  });

  shareScoreBtnEl.addEventListener('click', () => {
    if(!pendingSubmit) return;
    const text = '走れニンニクマンで500mを ' + formatClearTime(pendingSubmit.value) + ' でクリアしました！ #走れニンニクマン';
    const url = location.href;
    const intentUrl = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
    window.open(intentUrl, '_blank', 'noopener,noreferrer');
  });

  rankingBtnEl.addEventListener('click', openRanking);
  closeRankingBtnEl.addEventListener('click', closeRanking);
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  function finishGoal(){
    state = 'goal';
    goalTitleEl.textContent = 'ゴール!';
    const finalMs = elapsed * 1000;
    goalStatsEl.textContent = 'タイム: ' + formatClearTime(finalMs);
    showScoreSubmit(finalMs);
    resultFocusIndex = 0;
    updateResultFocus();
    checkAndShowRank(finalMs);
    resultInputLockUntil = performance.now() + 600;
    goalOverlayEl.classList.remove('hidden');
  }

  // ---------- Rendering ----------
  function drawGround(){
    ctx.fillStyle = '#4a9c52';
    ctx.strokeStyle = '#2f6e35';
    ctx.lineWidth = 4;
    let drawing = false;
    let chunkStartSx = 0;
    ctx.beginPath();
    for(let i = 0; i < terrain.length; i++){
      const p = terrain[i];
      const sx = p.x - camX;
      if(!drawing){ ctx.moveTo(sx, p.y); drawing = true; chunkStartSx = sx; }
      else ctx.lineTo(sx, p.y);
      if(p.gapAfter){
        // close and fill this ground chunk (flat bottom back to this chunk's
        // own start — NOT terrain[0] — otherwise closePath() connects the
        // gap edge diagonally back up to the start's surface height instead
        // of along y=540, leaving a wedge of the chunk unfilled)
        ctx.lineTo(sx, 540);
        ctx.lineTo(chunkStartSx, 540);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        drawing = false;
      }
    }
    if(drawing){
      const last = terrain[terrain.length - 1];
      ctx.lineTo(last.x - camX, 540);
      ctx.lineTo(chunkStartSx, 540);
      ctx.closePath();
      ctx.fill();
    }
    // stroke the surface line separately (thin skin over each ground chunk)
    ctx.beginPath();
    drawing = false;
    for(let i = 0; i < terrain.length; i++){
      const p = terrain[i];
      const sx = p.x - camX;
      if(!drawing){ ctx.moveTo(sx, p.y); drawing = true; } else ctx.lineTo(sx, p.y);
      if(p.gapAfter){ ctx.stroke(); ctx.beginPath(); drawing = false; }
    }
    ctx.stroke();

    // goal flag
    const gx = GOAL_X - camX;
    ctx.fillStyle = '#fff';
    ctx.fillRect(gx - 2, GROUND_BASE - 90, 4, 90);
    ctx.fillStyle = '#C8481A';
    ctx.beginPath();
    ctx.moveTo(gx + 2, GROUND_BASE - 90);
    ctx.lineTo(gx + 34, GROUND_BASE - 76);
    ctx.lineTo(gx + 2, GROUND_BASE - 62);
    ctx.closePath();
    ctx.fill();

    // 庭園っぽい小さな花を等間隔に飾る(穴の上には咲かせない)
    const FLOWER_COLORS = ['#fff5c0', '#ffd6e8', '#ffffff'];
    const FLOWER_SPACING = 70;
    const viewStart = Math.floor(camX / FLOWER_SPACING) * FLOWER_SPACING;
    for(let fx = viewStart; fx < camX + 980; fx += FLOWER_SPACING){
      const info = groundInfoAt(fx);
      if(!info) continue;
      const sx2 = fx - camX;
      const fy = info.y - 3;
      const colorIdx = Math.abs(Math.round(fx / FLOWER_SPACING)) % FLOWER_COLORS.length;
      ctx.fillStyle = '#3f8a45';
      ctx.fillRect(sx2 - 1, fy - 6, 2, 6);
      ctx.fillStyle = FLOWER_COLORS[colorIdx];
      for(let k = 0; k < 4; k++){
        const ang = (Math.PI / 2) * k;
        ctx.beginPath();
        ctx.arc(sx2 + Math.cos(ang) * 3, fy - 6 + Math.sin(ang) * 3, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#F3980D';
      ctx.beginPath();
      ctx.arc(sx2, fy - 6, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCastleBackdrop(){
    // マリオ64のピーチ城の庭っぽい遠景(オリジナル画で再現。実際の画像素材は使用していない)
    const parallaxSky = 0.1, parallaxHill = 0.25;

    // 空の雲
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    const cloudBaseX = -((camX * parallaxSky) % 300);
    for(let i = -1; i < 5; i++){
      const cx = cloudBaseX + i * 300;
      const cy = 70 + (i % 2) * 30;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 34, 16, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 26, cy + 4, 24, 13, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - 26, cy + 6, 22, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 遠くの丘
    const hillBaseX = -((camX * parallaxHill) % 480);
    ctx.fillStyle = '#8fd18a';
    for(let i = -1; i < 4; i++){
      const hx = hillBaseX + i * 480;
      ctx.beginPath();
      ctx.moveTo(hx - 40, GROUND_BASE);
      ctx.quadraticCurveTo(hx + 140, GROUND_BASE - 130, hx + 320, GROUND_BASE);
      ctx.closePath();
      ctx.fill();
    }

    // ピーチ城っぽい城のシルエット(1回だけ、コース序盤の背景に固定)
    // ゴール付近に固定表示(遠景ではなく地形と同じ1:1スクロールにして、
    // ゴールに近づいてもズレずにちゃんとその場に立っているようにする)
    const castleWorldX = GOAL_X - 190;
    const cx = castleWorldX - camX;
    const baseY = GROUND_BASE - 40;
    ctx.fillStyle = '#e9dfc7';
    ctx.strokeStyle = '#b7a67e';
    ctx.lineWidth = 2;
    // 本館
    ctx.fillRect(cx - 55, baseY - 90, 110, 90);
    ctx.strokeRect(cx - 55, baseY - 90, 110, 90);
    // 左右の塔
    [-78, 56].forEach((dx) => {
      ctx.fillRect(cx + dx, baseY - 120, 22, 120);
      ctx.strokeRect(cx + dx, baseY - 120, 22, 120);
      ctx.fillStyle = '#C8481A';
      ctx.beginPath();
      ctx.moveTo(cx + dx - 4, baseY - 120);
      ctx.lineTo(cx + dx + 11, baseY - 150);
      ctx.lineTo(cx + dx + 26, baseY - 120);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#e9dfc7';
    });
    // 中央の塔
    ctx.fillRect(cx - 16, baseY - 160, 32, 160);
    ctx.strokeRect(cx - 16, baseY - 160, 32, 160);
    ctx.fillStyle = '#C8481A';
    ctx.beginPath();
    ctx.moveTo(cx - 20, baseY - 160);
    ctx.lineTo(cx, baseY - 195);
    ctx.lineTo(cx + 20, baseY - 160);
    ctx.closePath();
    ctx.fill();
    // 旗
    ctx.strokeStyle = '#8a7a55';
    ctx.beginPath();
    ctx.moveTo(cx, baseY - 195);
    ctx.lineTo(cx, baseY - 212);
    ctx.stroke();
    ctx.fillStyle = '#F3980D';
    ctx.beginPath();
    ctx.moveTo(cx, baseY - 212);
    ctx.lineTo(cx + 16, baseY - 206);
    ctx.lineTo(cx, baseY - 200);
    ctx.closePath();
    ctx.fill();
    // 円窓
    ctx.fillStyle = '#7fb9e0';
    ctx.beginPath();
    ctx.arc(cx, baseY - 110, 10, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawObstacles(){
    ctx.fillStyle = '#6b6258';
    ctx.strokeStyle = '#3f3a33';
    ctx.lineWidth = 2;
    for(const ob of OBSTACLES){
      const info = groundInfoAt(ob.x + ob.w / 2);
      const baseY = info ? info.y : GROUND_BASE;
      const gx = ob.x - camX;
      ctx.beginPath();
      ctx.moveTo(gx, baseY);
      ctx.lineTo(gx + ob.w * 0.3, baseY - ob.h);
      ctx.lineTo(gx + ob.w * 0.7, baseY - ob.h);
      ctx.lineTo(gx + ob.w, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawPipe(){
    const gx = PIPE_X - camX;
    if(gx < -60 || gx > 1020) return;
    ctx.fillStyle = '#3ea62f';
    ctx.strokeStyle = '#245c1b';
    ctx.lineWidth = 3;
    const bodyTop = PIPE_TOP + PIPE_RIM_H;
    // 地面より下は塗っても地形の下に隠れるはずが、地形より後に描画しているため
    // 前面に浮いて見えてしまっていた。地面の高さでぴったり止めて隠れる部分を描かない。
    const groundHereInfo = groundInfoAt(PIPE_X);
    const bodyBottom = groundHereInfo ? groundHereInfo.y : GROUND_BASE;
    ctx.fillRect(gx - PIPE_W / 2 + 5, bodyTop, PIPE_W - 10, bodyBottom - bodyTop);
    ctx.strokeRect(gx - PIPE_W / 2 + 5, bodyTop, PIPE_W - 10, bodyBottom - bodyTop);
    ctx.fillRect(gx - PIPE_W / 2, PIPE_TOP, PIPE_W, PIPE_RIM_H + 4);
    ctx.strokeRect(gx - PIPE_W / 2, PIPE_TOP, PIPE_W, PIPE_RIM_H + 4);
  }

  function drawLegs(phase){
    // 走るモーション: 接地している脚は前→後ろへ蹴り、逆の脚は後ろ→前へ持ち上げて振り戻す
    const hip = { x: 0, y: -14 };
    const stride = 7, lift = 6;
    ctx.strokeStyle = '#e8dcc0';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    for(let i = 0; i < 2; i++){
      const p = phase + i * Math.PI;
      const fx = Math.cos(p) * stride;
      const fy = -Math.max(0, -Math.sin(p)) * lift;
      ctx.beginPath();
      ctx.moveTo(hip.x, hip.y);
      ctx.lineTo(fx, fy);
      ctx.stroke();
      ctx.fillStyle = '#8a6d3b';
      ctx.beginPath(); ctx.arc(fx, fy, 2.4, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawPlayer(){
    const sx = player.x - camX;
    const sy = player.y;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(player.angle);

    drawLegs(player.legPhase);

    // ニンニクマン本体(頭〜腰。脚は上のdrawLegsで表現するため画像下部はクロップ)
    if(charImg.complete && charImg.naturalWidth){
      const cw = 32, srcW = 379, srcH = 300; // 300/400 = 元画像の脚を除いた上半身部分
      const ch = cw * (srcH / srcW);
      const hipY = -14;
      ctx.drawImage(charImg, 0, 0, srcW, srcH, -cw/2, hipY - ch, cw, ch);
    } else {
      ctx.fillStyle = '#F5E7C6';
      ctx.strokeStyle = '#C8481A';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, -33, 11, 13, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0, 0, 960, 540);
    // sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, 540);
    grad.addColorStop(0, '#6fc1ef');
    grad.addColorStop(1, '#bfe8ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 960, 540);

    drawCastleBackdrop();
    drawGround();
    drawObstacles();
    drawPipe();
    drawDustPuffs();

    if(state === 'intro' && introPhase === 'rise'){
      // 土管のフチまでせり上がる途中は、フチより下の部分をクリップして隠す
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, 960, PIPE_TOP);
      ctx.clip();
      drawPlayer();
      ctx.restore();
    } else {
      drawPlayer();
    }

    drawComboPopup();
  }

  function drawComboPopup(){
    if(!comboPopup || comboPopup.timer <= 0) return;
    const t = Math.max(0, comboPopup.timer / comboPopup.maxTimer);
    const big = !!comboPopup.big;
    const sx = player.x - camX;
    const sy = player.y - (big ? 76 : 68) - (1 - t) * (big ? 28 : 18);
    ctx.save();
    ctx.globalAlpha = Math.min(1, t * 2);
    ctx.font = 'bold ' + (big ? 26 : 18) + 'px "Yu Gothic", Meiryo, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = big ? 4 : 3;
    ctx.strokeStyle = big ? '#8a1f0a' : '#5b3a1e';
    ctx.fillStyle = big ? '#FFD23F' : '#F3980D';
    ctx.strokeText(comboPopup.text, sx, sy);
    ctx.fillText(comboPopup.text, sx, sy);
    ctx.restore();
  }

  function spawnDustPuff(worldX, groundY){
    for(let i = 0; i < 9; i++){
      const ang = Math.PI + (Math.random() - 0.5) * Math.PI * 0.9; // 主に上向きに広がる
      const speed = 24 + Math.random() * 34;
      dustPuffs.push({
        x: worldX + (Math.random() - 0.5) * 14,
        y: groundY - 2,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        life: 420 + Math.random() * 160,
        maxLife: 580,
        r: 5 + Math.random() * 4,
      });
    }
  }

  function drawDustPuffs(){
    for(const d of dustPuffs){
      const t = Math.max(0, d.life / d.maxLife);
      const sx = d.x - camX;
      ctx.save();
      ctx.globalAlpha = Math.min(1, t * 1.3) * 0.9;
      ctx.fillStyle = '#f5f1e4';
      ctx.strokeStyle = 'rgba(150,138,110,.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(sx, d.y, d.r * (2 - t * 0.7), 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  // ---------- Main loop ----------
  function loop(now){
    if(!lastTime) lastTime = now;
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;

    if(state === 'play') updatePlay(dt);
    else if(state === 'intro') updateIntro(dt);

    draw();
    requestAnimationFrame(loop);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  retryBtnEl.addEventListener('click', startGame);
  backToStartBtnEl.addEventListener('click', backToStart);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);
  document.getElementById('popupBtn').addEventListener('click', () => {
    const w = 1000, h = 620;
    const left = Math.round((window.screen.width - w) / 2);
    const top = Math.round((window.screen.height - h) / 2);
    const popupUrl = location.origin + location.pathname + '?popup=1';
    window.open(
      popupUrl,
      'running-ninniku-popup',
      'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top +
        ',menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=no'
    );
  });

  // ---------- タッチ操作(スマホ向け) ----------
  const isTouchDevice = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  if(isTouchDevice){
    tcLeanBackEl.classList.add('show');
    tcLeanFwdEl.classList.add('show');
    tcHintEl.classList.add('show');
  }
  function bindHoldButton(el, action){
    const press = (e) => { e.preventDefault(); heldActions.add(action); };
    const release = (e) => { if(e) e.preventDefault(); heldActions.delete(action); };
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release);
    el.addEventListener('touchcancel', release);
  }
  bindHoldButton(tcLeanBackEl, 'leanBack');
  bindHoldButton(tcLeanFwdEl, 'leanForward');
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    tryJump();
  }, { passive: false });

  resetPlayer();
  distTotalEl.textContent = Math.round(GOAL_X / 10);
  fitToWindow();
  requestAnimationFrame(loop);
})();
</script>

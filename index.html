<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>走れニンニクマン(開発中)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3E7;
    --panel:#FFFFFF;
    --ink:#4A3B2D;
    --outline:#8C7C6E;
    --outline-dark:#5B4C3E;
    --golden:#F3980D;
    --terracotta:#C8481A;
    --ivory:#FBEFD9;
    --taupe:#B7A499;
    --shadow: rgba(74,59,45,0.18);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--cream);
    font-family:'Zen Maru Gothic', sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    background-image:
      radial-gradient(circle at 8% 12%, rgba(243,152,13,0.10) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(200,72,26,0.08) 0, transparent 45%);
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    height:100dvh;
  }
  #wrap{
    width: max-content;
    flex-shrink: 0;
    margin: 0 auto;
    padding: 18px 14px calc(24px + env(safe-area-inset-bottom));
    transform-origin: center center;
  }
  header{ display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:14px; }
  html.popup-mode header{ display:none; }
  header img{ width:52px; height:auto; filter: drop-shadow(0 3px 0 var(--shadow)); }
  h1{
    font-size: clamp(22px, 4vw, 30px);
    font-weight:900;
    margin:0;
    letter-spacing: 0.02em;
    color: var(--terracotta);
    text-shadow: 2px 2px 0 var(--ivory), -1px -1px 0 var(--ivory), 1px -1px 0 var(--ivory), -1px 1px 0 var(--ivory);
  }
  .board-shell{
    background: var(--panel);
    border: 4px solid var(--outline-dark);
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 8px 0 var(--shadow);
    touch-action: none;
  }
  .canvas-area{ position:relative; }
  canvas{ display:block; width:960px; height:540px; background:#8fd0f2; border-radius:10px; touch-action:none; }
  #buttonPanel{ margin-top:10px; }
  #hud{ position:absolute; top:20px; left:20px; right:20px; display:flex; justify-content:space-between; pointer-events:none; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); font-size:15px; font-weight:bold; }
  #hud .box{ background:rgba(0,0,0,.35); padding:6px 12px; border-radius:8px; }
  #timeHud{ position:absolute; top:54px; right:20px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); font-size:15px; font-weight:bold; pointer-events:none; }
  button{ font-family:'Zen Maru Gothic', sans-serif; cursor:pointer; }
  .btn{
    background: var(--golden);
    border: 3px solid var(--outline-dark);
    color: #fff;
    font-weight: 700;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    box-shadow: 0 4px 0 var(--outline-dark);
    transition: transform 0.05s ease;
    width:100%;
  }
  .btn:active{ transform: translateY(3px); box-shadow: 0 1px 0 var(--outline-dark); }
  .btn.secondary{ background: var(--panel); color: var(--terracotta); }
  .btn-row{ display:flex; gap:8px; }
  #startOverlay .overlay-card{ width:520px; }
  .stage-btn{ flex:1 1 0; min-width:0; white-space:nowrap; }
  .touchBtn{ position:absolute; width:64px; height:64px; border-radius:50%; background:var(--panel); border:3px solid var(--outline-dark); color:var(--terracotta); font-size:24px; font-weight:900; display:none; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; touch-action:none; box-shadow: 0 4px 0 var(--outline-dark); }
  .touchBtn.show{ display:flex; }
  .touchBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--outline-dark); }
  #tcLeanBack{ left:16px; bottom:96px; }
  #tcLeanFwd{ left:16px; bottom:16px; }
  #tcHint{ position:absolute; bottom:20px; right:16px; color:#4a2c0f; background:rgba(255,255,255,.85); border-radius:8px; padding:4px 10px; font-size:12px; font-weight:bold; display:none; }
  #tcHint.show{ display:block; }
  #soundToggleBtn{ position:absolute; top:16px; left:710px; width:34px; height:34px; border-radius:50%; background:var(--panel); border:2px solid var(--outline-dark); color:var(--terracotta); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  #versionLabel{ position:absolute; bottom:14px; right:14px; color:rgba(255,255,255,.7); font-size:11px; font-weight:bold; text-shadow:0 1px 2px rgba(0,0,0,.5); pointer-events:none; }
  .overlay{ position:absolute; inset:0; background: var(--cream); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:16px; z-index:5; }
  .overlay.hidden{ display:none; }
  .overlay-card{ display:flex; flex-direction:column; align-items:stretch; gap:10px; width:300px; }
  .overlay-card h1{ margin:0; font-size:20px; color: var(--terracotta); font-weight:900; text-align:center; text-shadow:none; }
  #rankingOverlay .overlay-card h1{ font-size:28px; }
  .overlay-card p{ margin:0; font-size:13px; font-weight:500; color: var(--ink); text-align:center; }
  .overlay-mascot{ width:90px; height:auto; align-self:center; filter: drop-shadow(0 4px 0 var(--shadow)); }
  .btn.wide{ width:100%; box-sizing:border-box; }
  .hidden{ display:none !important; }
  #scoreSubmit{ display:flex; flex-direction:column; gap:10px; }
  .gameover-selected{ background: var(--golden) !important; color:#fff !important; box-shadow: 0 4px 0 var(--outline-dark) !important; }
  .gameover-unselected{ background: var(--panel) !important; color: var(--terracotta) !important; box-shadow: 0 4px 0 var(--outline-dark) !important; }
  #nameInput{ font-family:'Zen Maru Gothic', sans-serif; width:100%; box-sizing:border-box; padding:9px 12px; border-radius:10px; border:3px solid var(--outline-dark); font-size:14px; text-align:center; color: var(--ink); }
  #rankResultText{ margin:0; font-size:14px; color: var(--terracotta); font-weight:900; }
  #rankingEntries{ list-style:none; margin:0; padding:0; width:100%; max-height:400px; overflow-y:auto; text-align:left; }
  #rankingEntries li{ display:flex; align-items:center; gap:10px; padding:11px 8px; font-size:16px; border-bottom:1px solid rgba(140,124,110,0.25); }
  #rankingEntries li:nth-child(even){ background: rgba(243,152,13,0.08); }
  #rankingEntries li:last-child{ border-bottom:none; }
  .rank-no{ width:2.8em; font-weight:900; color: var(--ink); flex-shrink:0; text-align:center; font-size:14px; }
  .rank-no.rank-gold{ color:#C9971F; font-size:20px; }
  .rank-no.rank-silver{ color:#8C7C6E; font-size:18px; }
  .rank-no.rank-bronze{ color:#B7792F; font-size:16px; }
  .rank-name{ flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; color: var(--ink); }
  .rank-val{ font-weight:900; color: var(--terracotta); flex-shrink:0; font-variant-numeric: tabular-nums; }
  .rank-empty{ justify-content:center; text-align:center; color: var(--taupe); padding:14px 0; }
  #progressWrap{ position:absolute; bottom:8px; left:8px; right:8px; height:8px; background:rgba(0,0,0,.2); border-radius:6px; overflow:hidden; }
  #progressBar{ height:100%; width:0%; background:linear-gradient(90deg,var(--golden),var(--terracotta)); }
  #crashFlash{ position:absolute; inset:0; background:#ff0000; opacity:0; pointer-events:none; border-radius:10px; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <img id="headerMascotImg" alt="ニンニクマン">
    <h1>走れニンニクマン</h1>
  </header>

  <div class="board-shell">
    <div class="canvas-area">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="hud">
        <div class="box">速度: <span id="speedVal">0</span> km/h</div>
        <div class="box">距離: <span id="distVal">0</span> / <span id="distTotal">0</span> m</div>
      </div>
      <div id="timeHud" class="box">タイム: <span id="timeVal">0.00</span> 秒</div>
      <div id="stageLabel" class="box" style="position:absolute; top:20px; left:50%; transform:translateX(-50%); pointer-events:none;"></div>
      <div id="progressWrap"><div id="progressBar"></div></div>
      <div id="crashFlash"></div>
      <button class="touchBtn" id="tcLeanBack" type="button">↑</button>
      <button class="touchBtn" id="tcLeanFwd" type="button">↓</button>
      <div id="tcHint">タップでジャンプ</div>
      <button id="soundToggleBtn" type="button" title="効果音のON/OFF">🔊</button>
      <div id="versionLabel">v0.2.0</div>

      <div id="startOverlay" class="overlay">
        <div class="overlay-card">
          <div id="defaultStartPanel" style="display:flex; flex-direction:column; gap:10px;">
            <h1>走れニンニクマン</h1>
            <p>自動走行、操作不要!<br>Space/タップ: ジャンプ(穴・障害物に注意)<br>←→: 空中姿勢制御(着地で加減速)</p>
            <div class="btn-row">
              <button class="btn stage-btn" id="stage1Btn" type="button">ステージ1 ニンニクガーデン</button>
              <button class="btn stage-btn" id="stage2Btn" type="button">ステージ2 さむいさむいマウンテン</button>
            </div>
          </div>
          <div id="modeSelectPanel" class="hidden" style="display:flex; flex-direction:column; gap:10px;">
            <h1>走れニンニクマン</h1>
            <p>自動走行、操作不要!<br>Space/タップ: ジャンプ(穴・障害物に注意)<br>←→: 空中姿勢制御(着地で加減速)<br>矢印キー: 選択 / Enter・Space: 決定</p>
            <button class="btn wide" id="rtaModeBtn" type="button">16枚RTAモード(開発中)</button>
            <button class="btn secondary wide" id="modeBackBtn" type="button">戻る</button>
          </div>
        </div>
      </div>

      <div id="goalOverlay" class="overlay hidden">
        <div class="overlay-card">
          <img class="overlay-mascot" id="overlayMascotImg" alt="ニンニクマン">
          <h1 id="goalTitle">ゴール!</h1>
          <p id="goalStats"></p>
          <div id="scoreSubmit" class="hidden">
            <p id="rankResultText" class="hidden"></p>
            <input id="nameInput" type="text" maxlength="12" placeholder="なまえ(12文字まで)">
            <button class="btn wide" id="submitScoreBtn">ランキングに登録</button>
            <button class="btn secondary wide" id="shareScoreBtn">Xでシェア</button>
          </div>
          <button class="btn secondary wide" id="retryBtn">もう一度</button>
          <button class="btn secondary wide" id="backToStartBtn">スタートに戻る</button>
        </div>
      </div>

      <div id="rankingOverlay" class="overlay hidden">
        <div class="overlay-card" style="width:920px;">
          <h1 id="rankingTitle">ランキング</h1>
          <p style="text-align:center; margin-top:-8px;">←→キーでステージ切替</p>
          <ul id="rankingEntries"></ul>
          <button class="btn wide" id="closeRankingBtn">とじる</button>
        </div>
      </div>

      <div id="pauseOverlay" class="overlay hidden">
        <div class="overlay-card">
          <h1>PAUSE</h1>
          <button class="btn wide" id="resumeBtn">再開 [P]</button>
        </div>
      </div>
    </div>

    <div id="buttonPanel">
      <div class="btn-row">
        <button class="btn secondary" id="pauseBtn">一時停止 [P]</button>
        <button class="btn secondary" id="restartBtn">やり直す [R]</button>
        <button class="btn secondary" id="rankingBtn">ランキング [L]</button>
        <a class="btn secondary" id="wikiLinkBtn" href="wiki.html" target="_blank" rel="noopener" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">RTA攻略Wiki</a>
        <button class="btn secondary" id="popupBtn">ポップアップ化 [O]</button>
      </div>
    </div>
  </div>
</div>

  function playJumpVoice(tier){

    if(tier === 3 && Math.random() < JUMP_VOICE_3_RARE_CHANCE){

    const audio = jumpVoiceAudios[Math.max(0, Math.min(2, tier - 1))];

  let startFocusIndex = 0;

    if(!defaultStartPanelEl.classList.contains('hidden')) return [stage1BtnEl, stage2BtnEl];
    return [rtaModeBtnEl, modeBackBtnEl];
  }
  function updateStartFocus(){
    getStartFocusables().forEach((btn, i) => {

      btn.classList.toggle('gameover-unselected', i !== startFocusIndex);
    });

  function fitToWindow(){

  const DEFAULT_KEYS = {
    leanForward: ['ArrowRight', 'KeyS'],
    leanBack: ['ArrowLeft', 'KeyW'],
    jump: ['Space', null],
    pause: ['KeyP', null],
  };
  const KEY_ACTIONS = Object.keys(DEFAULT_KEYS);
  function cloneKeys(src){
    const out = {};
    KEY_ACTIONS.forEach(a => { out[a] = [src[a][0], src[a][1]]; });
    return out;
  }
  let keyBindings = cloneKeys(DEFAULT_KEYS);
  function loadKeyBindings(){
    try{
      const saved = JSON.parse(localStorage.getItem('ninniku-chari-keys') || '{}');
      keyBindings = cloneKeys(DEFAULT_KEYS);
      KEY_ACTIONS.forEach(a => {
        const v = saved[a];
        if(Array.isArray(v)){
          keyBindings[a] = [
            (typeof v[0] === 'string' || v[0] === null) ? v[0] : DEFAULT_KEYS[a][0],
            (typeof v[1] === 'string' || v[1] === null) ? v[1] : null,
          ];

    }catch(e){ keyBindings = cloneKeys(DEFAULT_KEYS); }
  }
  function actionForCode(code){
    for(const a of KEY_ACTIONS){ if(keyBindings[a].includes(code)) return a; }
    return null;
  }
  loadKeyBindings();

  const heldActions = new Set();
  // デバッグ用: どの画面からでもD+F同時押しでモード選択画面(未完成の
  // 16枚RTAモードを試すための画面)に強制的に戻れるショートカット
  // (開発中の動作確認をすばやく行うための一時的な仕込み)
  const debugKeysHeld = new Set();
  let debugComboTriggered = false;
  window.addEventListener('keydown', (e) => {
    if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if(e.code === 'KeyD' || e.code === 'KeyF'){
      debugKeysHeld.add(e.code);
      if(debugKeysHeld.has('KeyD') && debugKeysHeld.has('KeyF') && !debugComboTriggered){
        debugComboTriggered = true;
        closeRanking();
        debugOpenModeSelect();
      }
    }
    if(!rankingOverlayEl.classList.contains('hidden')){
      if(e.code === 'Escape' || e.code === 'Enter' || e.code === 'Space'){ e.preventDefault(); closeRanking(); }
      if(e.code === 'ArrowLeft' || e.code === 'ArrowRight'){
        e.preventDefault();
        const idx = STAGE_ORDER.indexOf(rankingViewStageId);
        const dir = e.code === 'ArrowLeft' ? -1 : 1;
        rankingViewStageId = STAGE_ORDER[(idx + dir + STAGE_ORDER.length) % STAGE_ORDER.length];
        renderRankingList();
      }
      return;
    }
    const action = actionForCode(e.code);
    if(action){ e.preventDefault(); heldActions.add(action); }
    if(action === 'pause'){ togglePause(); }
    if(action === 'jump' && !e.repeat){ tryJump(); }
    if(e.code === 'Escape' && state !== 'start'){ backToStart(); }
    if(e.code === 'KeyR'){ document.getElementById('restartBtn').click(); }
    if(e.code === 'KeyL'){ document.getElementById('rankingBtn').click(); }
    if(e.code === 'KeyO'){ document.getElementById('popupBtn').click(); }
    if(!goalOverlayEl.classList.contains('hidden')){
      const focusables = getResultFocusables();
      if(e.code === 'ArrowLeft' || e.code === 'ArrowUp'){ resultFocusIndex = (resultFocusIndex - 1 + focusables.length) % focusables.length; updateResultFocus(); }
      if(e.code === 'ArrowRight' || e.code === 'ArrowDown'){ resultFocusIndex = (resultFocusIndex + 1) % focusables.length; updateResultFocus(); }
    }
    if(!startOverlayEl.classList.contains('hidden')){
      const focusables = getStartFocusables();
      if(e.code === 'ArrowLeft' || e.code === 'ArrowUp'){ startFocusIndex = (startFocusIndex - 1 + focusables.length) % focusables.length; updateStartFocus(); }
      if(e.code === 'ArrowRight' || e.code === 'ArrowDown'){ startFocusIndex = (startFocusIndex + 1) % focusables.length; updateStartFocus(); }
    }
    if(e.code === 'Enter' || e.code === 'Space'){
      if(!startOverlayEl.classList.contains('hidden')){ getStartFocusables()[startFocusIndex].click(); }
      else if(!goalOverlayEl.classList.contains('hidden')){
        // ゴール/ゲームオーバー直後は、ジャンプの連打でそのまま結果画面を
        // 見ずに次へ進んでしまわないよう、少しの間だけ確定操作を無視する
        if(performance.now() < resultInputLockUntil) return;
        getResultFocusables()[resultFocusIndex].click();
      }
    }
  });
  window.addEventListener('keyup', (e) => {
    const action = actionForCode(e.code);
    if(action){ heldActions.delete(action); }
    if(e.code === 'KeyD' || e.code === 'KeyF'){
      debugKeysHeld.delete(e.code);
      if(!debugKeysHeld.has('KeyD') || !debugKeysHeld.has('KeyF')) debugComboTriggered = false;
    }
  });

  // ---------- Terrain (ステージごとの固定コース。距離はSTAGES[id].goalXで指定) ----------
  // Points define a ground polyline. gapAfter:true means there is NO ground
  // between this point and the next (a pit/ランプ gap the player must jump).
  // ice:true means the ground between this point and the next is frozen —
  // 乗っている間ずっと加速し続ける(ICE_SLIDE_ACCEL、後述)ので、
  // 区間に入ると速度計がぐんぐん伸びていく「滑る」体感になる。
  // 各ジャンプ台は dx=250,dy=-30 の登り坂で統一(巡航速度300px/s・ジャンプ初速420px/s
  // だと安全に180px前後まで届く実測値)、穴の幅は余裕を見て140pxに統一。ジャンプ台の
  // 助走・着地区間はice:trueにしない(着地直後の速度が読めないと事故りやすいため)。
  const GROUND_BASE = 400;

  const STAGES = {
    1: {
      name: 'ステージ1: ニンニクガーデン',
      goalX: 5000, // 500m (距離表示は x/10 メートル)
      terrain: [

        { x: 1490, y: GROUND_BASE - 10 },
        { x: 1800, y: GROUND_BASE + 10 },
        { x: 2100, y: GROUND_BASE - 60 },

    2: {

      terrain: [
        { x: 0,    y: GROUND_BASE },
        { x: 450,  y: GROUND_BASE },                       // 平坦なスタート区間
        { x: 700,  y: GROUND_BASE - 20, ice: true },       // 凍った滑走区間1
        { x: 950,  y: GROUND_BASE + 10 },
        { x: 1150, y: GROUND_BASE - 10 },
        { x: 1400, y: GROUND_BASE - 40, gapAfter: true },  // ジャンプ台1
        { x: 1540, y: GROUND_BASE - 10 },
        { x: 1850, y: GROUND_BASE + 30 },
        { x: 2150, y: GROUND_BASE - 60 },
        { x: 2450, y: GROUND_BASE - 90, ice: true },       // 凍った滑走区間2(稜線)
        { x: 2750, y: GROUND_BASE - 90 },
        { x: 2900, y: GROUND_BASE - 60 },
        { x: 3150, y: GROUND_BASE - 90, gapAfter: true },  // ジャンプ台2
        { x: 3290, y: GROUND_BASE - 60 },
        { x: 3600, y: GROUND_BASE - 20 },
        { x: 3900, y: GROUND_BASE },                        // 大氷山のふもと手前、小休止の平坦区間
        // ---- 大氷山(全区間iceberg:true。通常のice:trueよりずっと強力に滑り続けるので、
        // 勢いを保ったまま一気に駆け上がり、頂上を越えたらそのまま猛スピードで滑り降りる) ----
        { x: 4200, y: GROUND_BASE - 70,  iceberg: true },
        { x: 4500, y: GROUND_BASE - 170, iceberg: true },
        { x: 4750, y: GROUND_BASE - 210, iceberg: true },   // 中腹の小さな段(一息つける傾斜)
        { x: 5050, y: GROUND_BASE - 290, iceberg: true },
        { x: 5200, y: GROUND_BASE - 295, iceberg: true },   // 頂上
        { x: 5450, y: GROUND_BASE - 170, iceberg: true },
        { x: 5700, y: GROUND_BASE - 30,  iceberg: true },
        { x: 5900, y: GROUND_BASE,       iceberg: true },
        { x: 6000, y: GROUND_BASE },                        // 大氷山を滑り降りきった着地区間
        { x: 6250, y: GROUND_BASE - 20 },
        { x: 6500, y: GROUND_BASE + 20 },
        { x: 6800, y: GROUND_BASE - 10 },
        { x: 7050, y: GROUND_BASE - 40, gapAfter: true },  // ジャンプ台3
        { x: 7190, y: GROUND_BASE - 10 },
        { x: 7450, y: GROUND_BASE + 10 },
        { x: 7700, y: GROUND_BASE - 30, ice: true },        // 凍った滑走区間4
        { x: 7950, y: GROUND_BASE },
        { x: 8150, y: GROUND_BASE - 20 },
        { x: 8400, y: GROUND_BASE - 50, gapAfter: true },  // ジャンプ台4
        { x: 8540, y: GROUND_BASE - 20 },
        { x: 8850, y: GROUND_BASE },
        { x: 9200, y: GROUND_BASE },                        // 平坦なゴール前区間
        { x: 9500, y: GROUND_BASE },
        { x: 10000, y: GROUND_BASE },      // goal
      ],
      obstacles: [
        { x: 550,  w: 26, h: 24, type: 'rock' },
        { x: 1050, w: 34, h: 34, type: 'fuwafuwa', bounce: true }, // 踏むと大ジャンプできる
        { x: 1250, w: 30, h: 30, type: 'snowman' },
        { x: 1950, w: 24, h: 22, type: 'rock' },
        { x: 2600, w: 34, h: 34, type: 'fuwafuwa', bounce: true },
        { x: 3450, w: 32, h: 32, type: 'snowman' },
        { x: 6350, w: 24, h: 22, type: 'rock' },
        { x: 6600, w: 34, h: 34, type: 'fuwafuwa', bounce: true },
        { x: 7350, w: 30, h: 30, type: 'snowman' },
        { x: 8700, w: 26, h: 24, type: 'rock' },
        { x: 9350, w: 30, h: 30, type: 'snowman' },
        { x: 9600, w: 44, h: 44, penguin: true }, // 終盤のペンギンの親。当たったらゲームオーバー
      ],
      theme: {
        sky: ['#5f89b8', '#e8f6ff'],
        groundFill: '#eef6fb', groundStroke: '#a9c9db',
        iceFill: '#bdeeff', iceStroke: '#5fc9ef',
        obstacleFill: '#7d97a8', obstacleStroke: '#425263',
        backdrop: 'mountain', decor: 'snow', snow: true,
      },
    },
  };
  // ステージが増えるたびにSTAGESへ追記すれば、16枚RTAモードは自動でその順番を通しでプレイする
  const STAGE_ORDER = Object.keys(STAGES).map(Number).sort((a, b) => a - b);

  let selectedStageId = 1;
  let currentStageId = 1;
  let terrain, OBSTACLES, THEME, GOAL_X, STAR_X;
  let runMode = 'single'; // 'single' | 'rta'
  let rtaStageIndex = 0;  // RTA中、STAGE_ORDER上の現在位置
  let rtaTotalElapsed = 0; // RTA中、クリア済みステージの合計タイム(秒)

  function loadStage(id){
    const s = STAGES[id];
    currentStageId = id;
    terrain = s.terrain;
    OBSTACLES = s.obstacles;
    THEME = s.theme;
    GOAL_X = s.goalX;
    // 星を配置するステージは、星に触れた時点でゴール扱いにする(星が無ければ従来通りGOAL_Xで判定)
    STAR_X = (s.starX !== undefined) ? s.starX : s.goalX;
    stageLabelEl.textContent = s.name;
  }
  loadStage(1);

  // ステージボタンは押したら即スタート(選択→決定の2段階操作は不要)
  stage1BtnEl.addEventListener('click', () => { selectedStageId = 1; startGame(); });
  stage2BtnEl.addEventListener('click', () => { selectedStageId = 2; startGame(); });

  function findSegment(x){
    for(let i = 0; i < terrain.length - 1; i++){
      if(x >= terrain[i].x && x <= terrain[i+1].x) return i;
    }
    return x < terrain[0].x ? 0 : terrain.length - 2;
  }

  // Returns {y, angle, ice} of ground at x, or null if x is inside a gap (no ground).
  function groundInfoAt(x){
    const i = findSegment(x);
    const a = terrain[i], b = terrain[i+1];
    if(a.gapAfter) return null;
    const t = (x - a.x) / (b.x - a.x);
    const y = a.y + (b.y - a.y) * t;
    const angle = Math.atan2(b.y - a.y, b.x - a.x);
    return { y, angle, ice: !!a.ice, iceberg: !!a.iceberg };
  }

  // ---------- Physics constants ----------
  // 走れニンニクマンは一定速度で自動的に走り続けるゲームなので、加速・ブレーキ操作は無い。
  // プレイヤーが操作するのはジャンプのタイミングと、空中での姿勢(着地角度)のみ。
  const GRAVITY = 1500;          // px/s^2
  const CRUISE_SPEED = 300;      // px/s — 常にこの速度で走り続ける(操作不要)
  const SPEED_RECOVERY = 2.2;    // ジャンプ後の速度が巡航速度へ戻る速さ
  const ICE_SLIDE_ACCEL = 260;   // px/s^2 — 凍った地面(ice:true)では歯止めが効かず、乗っている間ずっと加速し続けて滑る
  const ICE_MAX_SPEED = 620;     // 氷上でも際限なく加速し続けないよう頭打ちにする速度
  const ICEBERG_SLIDE_ACCEL = 600; // px/s^2 — 大氷山(iceberg:true)は通常の氷よりめっちゃ滑る
  const ICEBERG_MAX_SPEED = 1000;  // 大氷山上の頭打ち速度(表示速度で約180km/h、MAX_SPEEDのすぐ下まで許容)
  const AIR_ROT_SPEED = 2.6;     // rad/s bike rotation control while airborne
  const MAX_SPEED = 1050;        // px/s
  const JUMP_IMPULSE = 420;      // upward kick from a manual jump (px/s)
  const PIT_FALL_Y = 640;        // falling past this = missed the jump, into the pit
  const LANDING_PERFECT_DEG = 10;
  const LANDING_OK_DEG = 30;
  const STREAK_BONUS_PER = 0.05; // 連続で着地に成功するたびに+5%ずつ加速が乗る
  const STREAK_CAP = 8;          // 最大+40%まで(それ以上は頭打ち)

  // マリオ64風の3段ジャンプ: 着地してすぐ(CHAIN_WINDOW_MS以内に)再ジャンプすると
  // 段数が上がってジャンプが高くなり、3段目でめっちゃ加速する。段数はそこでリセット。
  const CHAIN_WINDOW_MS = 300;
  const FAST_CHAIN_MS = 80; // これより速く再ジャンプできたら「最速フレーム」扱いで砂煙を出さない
  const JUMP_IMPULSE_LV = [1, 1.3, 1.7];
  const TRIPLE_JUMP_SPEED_BOOST = 1.6;

  // ---------- Intro (マリオ風の土管から登場する演出) ----------
  const PIPE_X = 60;
  const PIPE_W = 46;
  const PIPE_RIM_H = 10;
  const PIPE_HEIGHT = 34;             // 地面から突き出ている土管の高さ
  const PIPE_TOP = GROUND_BASE - PIPE_HEIGHT;
  const INTRO_HIDDEN_DROP = 50;       // 土管の中(フチより下)の隠れた開始位置
  const INTRO_RISE_MS = 550;          // 第1段階: 土管のフチまでせり上がる
  const INTRO_STEP_MS = 250;          // 第2段階: 地面まで降りる

  // ---------- Game state ----------
  let state = 'start'; // 'start' | 'intro' | 'play' | 'paused' | 'goal' | 'gameover'
  let player, camX, elapsed, lastTime, introTimer, introPhase;
  let resultFocusIndex = 0; // 0 = もう一度, 1 = スタートに戻る (goal/gameover画面での選択)
  let resultInputLockUntil = 0; // この時刻までは結果画面のEnter/Space確定を無視する
  let comboPopup = null; // { text, timer, maxTimer } — 連続ジャンプ成功時に浮かぶ表示
  let landingPopup = null; // { text, timer, maxTimer, color } — 着地角度の判定確認用デバッグ表示
  let dustPuffs = []; // 最速で3段ジャンプを繋げられなかった時に足元へ出す砂煙

  function resetPlayer(){
    player = {
      x: PIPE_X, y: GROUND_BASE, angle: 0, // 土管の位置から出てくるので、開始xを土管に合わせる
      speed: CRUISE_SPEED, // scalar forward speed while grounded
      vx: 0, vy: 0,        // used only while airborne
      airborne: false,
      legPhase: 0,
      jumpStreak: 0,
      jumpChain: 0,
      chainTimer: 0,
      lastLandTime: 0,
      pendingDustLand: false,
      spinSpeed: 0,
    };
    camX = 0;
    elapsed = 0;
    comboPopup = null;
    landingPopup = null;
    dustPuffs = [];
  }

  // ステージ開始の共通処理(単体ステージ・RTAの両方から呼ぶ)。ゴール演出を挟まず
  // 次のステージへ即続行したいRTAでも、これ単体で土管演出からやり直せる。
  function beginStagePlay(stageId){
    loadStage(stageId);
    if(runMode === 'rta'){
      stageLabelEl.textContent = (rtaStageIndex + 1) + '/' + STAGE_ORDER.length + '  ' + STAGES[stageId].name;
    }
    resetPlayer();
    player.y = PIPE_TOP + INTRO_HIDDEN_DROP; // 土管の中、フチより下の見えない位置からスタート
    state = 'intro';
    introPhase = 'rise';
    introTimer = INTRO_RISE_MS;
    startOverlayEl.classList.add('hidden');
    goalOverlayEl.classList.add('hidden');
    pauseOverlayEl.classList.add('hidden');
    hideScoreSubmit();
    distTotalEl.textContent = Math.round(GOAL_X / 10);
    timeValEl.textContent = '0.00';
  }

  function startGame(){
    runMode = 'single';
    beginStagePlay(selectedStageId);
    issueRunToken();
  }

  function startRTA(){
    runMode = 'rta';
    rtaStageIndex = 0;
    rtaTotalElapsed = 0;
    currentRunToken = null; // RTAはランキング未対応
    beginStagePlay(STAGE_ORDER[0]);
  }

  function retryCurrent(){
    if(runMode === 'rta') startRTA(); else startGame();
  }

  function updateIntro(dt){
    introTimer -= dt * 1000;
    if(introPhase === 'rise'){
      // 土管のフチまでせり上がる(この間はフチより下をクリップして隠す)
      const progress = Math.min(1, 1 - Math.max(0, introTimer) / INTRO_RISE_MS);
      const eased = 1 - Math.pow(1 - progress, 2); // ease-out
      player.y = (PIPE_TOP + INTRO_HIDDEN_DROP) - INTRO_HIDDEN_DROP * eased;
      player.legPhase += dt * 3;
      if(introTimer <= 0){
        player.y = PIPE_TOP;
        introPhase = 'step';
        introTimer = INTRO_STEP_MS;
      }
    } else {
      // 土管の上から地面まで降りる(もうクリップは不要)
      const progress = Math.min(1, 1 - Math.max(0, introTimer) / INTRO_STEP_MS);
      const eased = progress * progress; // ease-in
      player.y = PIPE_TOP + (GROUND_BASE - PIPE_TOP) * eased;
      player.legPhase += dt * 6;
      if(introTimer <= 0){
        player.y = GROUND_BASE;
        state = 'play';
      }
    }
  }

  function togglePause(){
    if(state === 'play'){ state = 'paused'; pauseOverlayEl.classList.remove('hidden'); }
    else if(state === 'paused'){ state = 'play'; pauseOverlayEl.classList.add('hidden'); lastTime = performance.now(); }
  }

  function backToStart(){
    state = 'start';
    goalOverlayEl.classList.add('hidden');
    pauseOverlayEl.classList.add('hidden');
    startOverlayEl.classList.remove('hidden');
    showDefaultStart();
  }

  // デバッグ用: どの画面からでも強制的にモード選択画面(未完成の16枚RTA
  // モードを試すための画面)を開く(D+Fショートカット専用)
  function debugOpenModeSelect(){
    state = 'start';
    goalOverlayEl.classList.add('hidden');
    pauseOverlayEl.classList.add('hidden');
    startOverlayEl.classList.remove('hidden');
    showModeSelect();
  }

  function getResultFocusables(){
    return scoreSubmitEl.classList.contains('hidden')
      ? [retryBtnEl, backToStartBtnEl]
      : [submitScoreBtnEl, shareScoreBtnEl, retryBtnEl, backToStartBtnEl];
  }

  function updateResultFocus(){
    const focusables = getResultFocusables();
    focusables.forEach((btn, i) => {
      btn.classList.toggle('gameover-selected', i === resultFocusIndex);
      btn.classList.toggle('gameover-unselected', i !== resultFocusIndex);
    });
  }

  function gameOver(reason){
    state = 'gameover';
    goalTitleEl.textContent = (runMode === 'rta')
      ? '16枚RTA失敗(' + (rtaStageIndex + 1) + '/' + STAGE_ORDER.length + ')'
      : 'ゲームオーバー';
    goalStatsEl.textContent = reason;
    hideScoreSubmit();
    resultFocusIndex = 0;
    updateResultFocus();
    resultInputLockUntil = performance.now() + 600;
    goalOverlayEl.classList.remove('hidden');
    crashFlashEl.style.transition = 'none';
    crashFlashEl.style.opacity = '0.5';
    requestAnimationFrame(() => {
      crashFlashEl.style.transition = 'opacity .4s';
      crashFlashEl.style.opacity = '0';
    });
  }

  function land(){
    const info = groundInfoAt(player.x);
    const groundAngle = info ? info.angle : 0;
    // 判定基準はプレイヤーが空中で作った姿勢(player.angle)であって、放物線の
    // 進行方向(velAngle)ではない。後者は重力で常に傾くため平地でも常にズレて
    // しまい、何もしなくても着地できる平地でBADになってしまうバグがあった。
    let diffDeg = Math.abs((player.angle - groundAngle) * 180 / Math.PI);
    diffDeg = Math.min(diffDeg, 360 - diffDeg);

    const landedSpeed = Math.hypot(player.vx, player.vy);
    player.airborne = false;
    player.y = info ? info.y : player.y;
    player.angle = groundAngle;
    player.spinSpeed = 0;

    // 着地角度の判定を画面に出す(角度が合っているほど加速する仕様の確認用)
    const landJudge = diffDeg <= LANDING_PERFECT_DEG ? 'PERFECT' : diffDeg <= LANDING_OK_DEG ? 'OK' : 'BAD';
    const landColor = diffDeg <= LANDING_PERFECT_DEG ? '#2ecc71' : diffDeg <= LANDING_OK_DEG ? '#f1c40f' : '#e74c3c';
    landingPopup = { text: landJudge + ' (' + diffDeg.toFixed(1) + '°)', timer: 700, maxTimer: 700, color: landColor };

    if(diffDeg <= LANDING_PERFECT_DEG){
      // perfect landing: speed boost
      player.speed = Math.min(MAX_SPEED, landedSpeed * 1.15);
      player.jumpStreak++;
    } else if(diffDeg <= LANDING_OK_DEG){
      player.speed = landedSpeed * 0.9;
      player.jumpStreak++;
    } else {
      // 着地が乱れても失速するだけ。クラッシュ演出(ダメージ)は出さない
      player.speed = landedSpeed * 0.65;
      player.jumpStreak = 0; // 着地が乱れるとコンボは途切れる
    }

    // 連続でジャンプの着地に成功するほど、加速にさらに加速が乗っていく
    if(player.jumpStreak >= 2){
      const bonus = 1 + Math.min(player.jumpStreak, STREAK_CAP) * STREAK_BONUS_PER;
      player.speed = Math.min(MAX_SPEED, player.speed * bonus);
      comboPopup = { text: 'コンボ ×' + player.jumpStreak + '!', timer: 900, maxTimer: 900 };
    }

    // 着地と同時にジャンプ入力があれば、タイミングを讃えて少し加速する
    if(heldActions.has('jump')){
      player.speed = Math.min(MAX_SPEED, player.speed * 1.08);
    }

    // 砂煙はすぐには出さず、FAST_CHAIN_MSの間ジャンプが来なければ出す(予約方式)。
    // 先に出してから取り消す方式だと、取り消しが届くまでの数フレームは
    // 必ず描画されてしまい一瞬チラつくため、この順番にしている。
    player.pendingDustLand = true;
    player.lastLandTime = performance.now();

    // すぐに再ジャンプすれば3段ジャンプに繋げられる猶予時間をセット
    player.chainTimer = CHAIN_WINDOW_MS;
  }

  function tryJump(){
    if(state !== 'play' || player.airborne) return;
    const info = groundInfoAt(player.x);
    const angle = info ? info.angle : 0;

    // 最速フレームで再ジャンプできたので、予約していた着地の砂煙は出さない
    player.pendingDustLand = false;

    if(player.jumpChain > 0 && player.chainTimer > 0){
      player.jumpChain = Math.min(3, player.jumpChain + 1);
    } else {
      player.jumpChain = 1;
    }

    const impulseMul = JUMP_IMPULSE_LV[player.jumpChain - 1];
    playJumpVoice(player.jumpChain);
    player.airborne = true;
    player.vx = player.speed * Math.cos(angle);
    player.vy = player.speed * Math.sin(angle) - JUMP_IMPULSE * impulseMul;

    if(player.jumpChain >= 3){
      player.speed = Math.min(MAX_SPEED, player.speed * TRIPLE_JUMP_SPEED_BOOST);
      comboPopup = { text: '3段ジャンプ!!!', timer: 1100, maxTimer: 1100, big: true };
      player.jumpChain = 0; // マリオ64と同じく、3段の後は最初からやり直し
    }
  }

  function checkObstacleHit(){
    for(const ob of OBSTACLES){
      if(player.x + 9 < ob.x || player.x - 9 > ob.x + ob.w) continue;
      const info = groundInfoAt(Math.min(Math.max(player.x, ob.x), ob.x + ob.w));
      const groundY = info ? info.y : GROUND_BASE;
      const clearance = groundY - player.y; // how high above local ground the player currently is
      if(clearance < ob.h){
        if(ob.bounce){
          // ふわふわさん: ぶつかる(踏む)と大ジャンプで跳ね上がる。ゲームオーバーにはしない
          player.airborne = true;
          player.vx = player.speed;
          player.vy = -JUMP_IMPULSE * 2.4;
          player.jumpChain = 0;
          player.chainTimer = 0;
          player.spinSpeed = 16; // 大ジャンプ中、ニンニクマンが大回転する
          playJumpVoice(3);
          comboPopup = { text: '大ジャンプ!!', timer: 1000, maxTimer: 1000, big: true };
          return false;
        }
        gameOver(ob.penguin ? 'ペンギンの親にぶつかってしまった…' : '障害物にぶつかってしまった…');
        return true;
      }
    }
    return false;
  }

  function fallIntoPit(){
    gameOver('穴に落ちてしまった…');
  }

  function updatePlay(dt){
    elapsed += dt;
    const leanFwd = heldActions.has('leanForward');
    const leanBack = heldActions.has('leanBack');

    if(comboPopup){
      comboPopup.timer -= dt * 1000;
      if(comboPopup.timer <= 0) comboPopup = null;
    }
    if(landingPopup){
      landingPopup.timer -= dt * 1000;
      if(landingPopup.timer <= 0) landingPopup = null;
    }
    for(let i = dustPuffs.length - 1; i >= 0; i--){
      const d = dustPuffs[i];
      d.life -= dt * 1000;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.vy += 40 * dt;
      if(d.life <= 0) dustPuffs.splice(i, 1);
    }

    if(!player.airborne){
      const info = groundInfoAt(player.x);
      if(info === null){
        // walked past the edge without jumping in time — start falling into the pit
        player.airborne = true;
        player.vx = player.speed;
        player.vy = 0;
      } else {
        player.y = info.y;
        player.angle = info.angle;

        // 一定速度で走り続ける。ジャンプの着地直後だけ一時的に速度がずれるので
        // 巡航速度へ滑らかに戻す(加速・ブレーキ操作はしなくてよい)。
        // 凍った地面(ice)は摩擦が効かず、乗っている間ずっと勝手に加速していく=滑る。
        // 大氷山(iceberg)はさらに強力にこれが働く。氷区間を抜けると、
        // また通常どおり巡航速度へ戻っていく。
        if(info.iceberg){
          player.speed = Math.min(ICEBERG_MAX_SPEED, player.speed + ICEBERG_SLIDE_ACCEL * dt);
        } else if(info.ice){
          player.speed = Math.min(ICE_MAX_SPEED, player.speed + ICE_SLIDE_ACCEL * dt);
        } else {
          player.speed += (CRUISE_SPEED - player.speed) * SPEED_RECOVERY * dt;
        }
        player.x += player.speed * dt;
        player.legPhase = (player.legPhase + player.speed * dt * 0.05) % (Math.PI * 2);

        if(player.chainTimer > 0){
          player.chainTimer -= dt * 1000;
          if(player.chainTimer <= 0) player.jumpChain = 0; // 猶予切れで3段ジャンプの連鎖が途切れる
        }

        // 最速フレームで再ジャンプが来ないまま予約時間が過ぎたら、ここで初めて砂煙を出す
        if(player.pendingDustLand && performance.now() - player.lastLandTime >= FAST_CHAIN_MS){
          spawnDustPuff(player.x, player.y);
          player.pendingDustLand = false;
        }
      }
    }

    if(player.airborne){
      player.vy += GRAVITY * dt;
      if(player.spinSpeed){
        player.angle += player.spinSpeed * dt;
      } else {
        if(leanFwd) player.angle += AIR_ROT_SPEED * dt;
        if(leanBack) player.angle -= AIR_ROT_SPEED * dt;
      }
      player.x += player.vx * dt;
      player.y += player.vy * dt;
      player.legPhase += dt * 6;

      if(player.y > PIT_FALL_Y){ fallIntoPit(); return; }

      const info = groundInfoAt(player.x);
      if(info !== null && player.y >= info.y){
        land();
      }
    }

    if(state === 'play') checkObstacleHit();

    if(state === 'play' && player.x >= STAR_X){
      player.x = STAR_X;
      finishGoal();
    }

    camX = Math.max(0, player.x - 260);
    speedValEl.textContent = Math.round(player.speed * 0.18); // arbitrary km/h scaling
    distValEl.textContent = Math.round(player.x / 10);
    timeValEl.textContent = (runMode === 'rta' ? rtaTotalElapsed + elapsed : elapsed).toFixed(2);
    progressBarEl.style.width = Math.min(100, (player.x / STAR_X) * 100) + '%';
  }

  // ---------- ランキング(一時的にtetris_ninniku.htmlと同じ構成で追加) ----------
  // ステージごとに別のランキングファイル/モードを持つ(将来ステージが増えたら追記する)
  const RANKING_FILES = { 1: 'ranking-clear.json', 2: 'ranking-clear2.json' };
  const RANKING_MODES = { 1: 'clear', 2: 'clear2' };
  function rankingFileFor(stageId){ return RANKING_FILES[stageId] || RANKING_FILES[1]; }
  function rankingModeFor(stageId){ return RANKING_MODES[stageId] || RANKING_MODES[1]; }
  // Cloudflare Workerを経由してGitHub Issue化し、GitHub Actionsでranking-clear*.jsonを更新する。
  // Worker未デプロイの間は登録に失敗するだけで、閲覧(ランキング表示)は空一覧として動作する。
  const RANKING_SUBMIT_URL = 'https://ninniku-chari.rapidpredict.workers.dev/';
  const RANKING_START_URL = RANKING_SUBMIT_URL + 'start';
  let pendingSubmit = null;
  // スタート時にサーバーへ署名付きトークンを発行してもらい、ゴール時にそのトークンと
  // 一緒に送る。サーバー側はトークン発行からの実経過時間より速いタイムを拒否するので、
  // DevTools等からゲームを介さず直接送信しても登録できない(不正対策)。
  let currentRunToken = null;
  async function issueRunToken(){
    currentRunToken = null;
    try{
      const res = await fetch(RANKING_START_URL, { method: 'POST' });
      const data = await res.json().catch(() => null);
      if(res.ok && data && data.ok && data.token) currentRunToken = data.token;
    }catch(e){ /* ネットワーク不通なら currentRunToken は null のまま(登録時にエラー表示) */ }
  }

  function formatClearTime(ms){
    const totalMs = Math.round(ms);
    const m = Math.floor(totalMs / 60000);
    const s = Math.floor((totalMs % 60000) / 1000);
    const cs = Math.floor((totalMs % 1000) / 10);
    return (m > 0 ? m + ':' + String(s).padStart(2, '0') : s) + '.' + String(cs).padStart(2, '0');
  }

  async function fetchRanking(stageId){
    try{
      const res = await fetch(rankingFileFor(stageId), { cache: 'no-store' });
      if(!res.ok) return null;
      const list = await res.json();
      return Array.isArray(list) ? list : [];
    }catch(e){ return null; }
  }

  async function checkAndShowRank(valueMs, stageId){
    rankResultTextEl.textContent = '順位を確認中…';
    rankResultTextEl.classList.remove('hidden');
    const list = await fetchRanking(stageId);
    if(!pendingSubmit || pendingSubmit.value !== valueMs) return;
    if(list === null){
      rankResultTextEl.classList.add('hidden');
      return;
    }
    let rank = list.findIndex(e => valueMs < e.value);
    if(rank === -1) rank = list.length;
    rank += 1;
    rankResultTextEl.textContent = '現在の順位: ' + rank + '位';
  }

  async function renderRankingList(){
    const viewStageId = rankingViewStageId;
    rankingTitleEl.textContent = 'ランキング(' + STAGES[viewStageId].name + ')';
    rankingEntriesEl.innerHTML = '';
    const loadingLi = document.createElement('li');
    loadingLi.textContent = '読み込み中…';
    loadingLi.className = 'rank-empty';
    rankingEntriesEl.appendChild(loadingLi);
    const list = await fetchRanking(viewStageId);
    if(viewStageId !== rankingViewStageId) return; // 取得中にステージが切り替えられた
    rankingEntriesEl.innerHTML = '';
    if(list === null){
      const li = document.createElement('li');
      li.textContent = 'ランキングを取得できませんでした';
      li.className = 'rank-empty';
      rankingEntriesEl.appendChild(li);
      return;
    }
    if(list.length === 0){
      const li = document.createElement('li');
      li.textContent = 'まだ記録がありません';
      li.className = 'rank-empty';
      rankingEntriesEl.appendChild(li);
      return;
    }
    list.forEach((e, i) => {
      const li = document.createElement('li');
      const medalClass = i === 0 ? ' rank-gold' : i === 1 ? ' rank-silver' : i === 2 ? ' rank-bronze' : '';
      const noSpan = document.createElement('span');
      noSpan.className = 'rank-no' + medalClass;
      noSpan.textContent = (i + 1) + '位';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'rank-name';
      nameSpan.textContent = e.name || '名無しさん';
      const valSpan = document.createElement('span');
      valSpan.className = 'rank-val';
      valSpan.textContent = formatClearTime(e.value);
      li.append(noSpan, nameSpan, valSpan);
      rankingEntriesEl.appendChild(li);
    });
  }

  let rankingReturnToPlay = false;
  let rankingViewStageId = 1;
  function openRanking(){
    if(state === 'play'){ state = 'paused'; rankingReturnToPlay = true; }
    else { rankingReturnToPlay = false; }
    rankingViewStageId = currentStageId;
    rankingOverlayEl.classList.remove('hidden');
    renderRankingList();
  }
  function closeRanking(){
    rankingOverlayEl.classList.add('hidden');
    if(rankingReturnToPlay){ state = 'play'; lastTime = performance.now(); rankingReturnToPlay = false; }
  }

  function showScoreSubmit(valueMs){
    pendingSubmit = { value: valueMs, stageId: currentStageId };
    let savedName = '';
    try{ savedName = localStorage.getItem('ninniku-chari-playername') || ''; }catch(e){ /* ignore */ }
    nameInputEl.value = savedName;
    submitScoreBtnEl.textContent = 'ランキングに登録';
    submitScoreBtnEl.disabled = false;
    shareScoreBtnEl.textContent = 'Xでシェア';
    scoreSubmitEl.classList.remove('hidden');
  }
  function hideScoreSubmit(){
    pendingSubmit = null;
    scoreSubmitEl.classList.add('hidden');
  }

  submitScoreBtnEl.addEventListener('click', async () => {
    if(!pendingSubmit) return;
    let name = nameInputEl.value.replace(/[\r\n]/g, '').trim().slice(0, 12);
    if(!name) name = '名無しさん';
    try{ localStorage.setItem('ninniku-chari-playername', name); }catch(e){ /* ignore */ }
    const { value, stageId } = pendingSubmit;
    if(!currentRunToken){
      submitScoreBtnEl.textContent = '登録に失敗しました(プレイ確認トークンがありません)';
      return;
    }
    submitScoreBtnEl.disabled = true;
    submitScoreBtnEl.textContent = '登録中…';
    try{
      const res = await fetch(RANKING_SUBMIT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: rankingModeFor(stageId), value, name, token: currentRunToken }),
      });
      const data = await res.json().catch(() => null);
      if(res.ok && data && data.ok){
        submitScoreBtnEl.textContent = '登録しました！反映まで少々お待ちください';
      } else {
        submitScoreBtnEl.textContent = '登録に失敗しました。もう一度お試しください';
        submitScoreBtnEl.disabled = false;
      }
    }catch(e){
      submitScoreBtnEl.textContent = '登録に失敗しました(通信エラー)';
      submitScoreBtnEl.disabled = false;
    }
  });

  shareScoreBtnEl.addEventListener('click', () => {
    if(!pendingSubmit) return;
    const stage = STAGES[pendingSubmit.stageId] || STAGES[1];
    const stageName = stage.name.includes(': ') ? stage.name.split(': ')[1] : stage.name;
    const text = '走れニンニクマンで' + stageName + 'を ' + formatClearTime(pendingSubmit.value) + ' でクリアしました！ #走れニンニクマン';
    const url = location.href;
    const intentUrl = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
    window.open(intentUrl, '_blank', 'noopener,noreferrer');
  });

  rankingBtnEl.addEventListener('click', openRanking);
  closeRankingBtnEl.addEventListener('click', closeRanking);
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('restartBtn').addEventListener('click', () => retryCurrent());

  function finishGoal(){
    if(runMode === 'rta'){
      rtaTotalElapsed += elapsed;
      rtaStageIndex++;
      if(rtaStageIndex < STAGE_ORDER.length){
        // ゴール演出は挟まず、次のステージへシームレスに続行する
        beginStagePlay(STAGE_ORDER[rtaStageIndex]);
        return;
      }
      state = 'goal';
      goalTitleEl.textContent = '16枚RTA クリア!';
      goalStatsEl.textContent = 'トータルタイム: ' + formatClearTime(rtaTotalElapsed * 1000);
      hideScoreSubmit();
      resultFocusIndex = 0;
      updateResultFocus();
      resultInputLockUntil = performance.now() + 600;
      goalOverlayEl.classList.remove('hidden');
      return;
    }

    state = 'goal';
    const finalMs = elapsed * 1000;
    goalStatsEl.textContent = 'タイム: ' + formatClearTime(finalMs);
    goalTitleEl.textContent = (currentStageId === 1) ? 'ゴール!' : 'ステージ' + currentStageId + ' クリア!';
    showScoreSubmit(finalMs);
    checkAndShowRank(finalMs, currentStageId);
    resultFocusIndex = 0;
    updateResultFocus();
    resultInputLockUntil = performance.now() + 600;
    goalOverlayEl.classList.remove('hidden');
  }

  // ---------- Rendering ----------
  // ワールドx座標から0以上1未満の疑似乱数を作る(毎フレーム同じ結果になるので、
  // 氷山の飾りがカメラスクロール中にチラつかず安定して見える)
  function hash01(n){
    const s = Math.sin(n * 12.9898) * 43758.5453;
    return s - Math.floor(s);
  }
  const ICEBERG_SPACING = 55;

  function drawGround(){
    ctx.fillStyle = THEME.groundFill;
    ctx.strokeStyle = THEME.groundStroke;
    ctx.lineWidth = 4;
    let drawing = false;
    let chunkStartSx = 0;
    ctx.beginPath();
    for(let i = 0; i < terrain.length; i++){
      const p = terrain[i];
      const sx = p.x - camX;
      if(!drawing){ ctx.moveTo(sx, p.y); drawing = true; chunkStartSx = sx; }
      else ctx.lineTo(sx, p.y);
      if(p.gapAfter){
        // close and fill this ground chunk (flat bottom back to this chunk's
        // own start — NOT terrain[0] — otherwise closePath() connects the
        // gap edge diagonally back up to the start's surface height instead
        // of along y=540, leaving a wedge of the chunk unfilled)
        ctx.lineTo(sx, 540);
        ctx.lineTo(chunkStartSx, 540);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        drawing = false;
      }
    }
    if(drawing){
      const last = terrain[terrain.length - 1];
      ctx.lineTo(last.x - camX, 540);
      ctx.lineTo(chunkStartSx, 540);
      ctx.closePath();
      ctx.fill();
    }
    // stroke the surface line separately (thin skin over each ground chunk)
    ctx.beginPath();
    drawing = false;
    for(let i = 0; i < terrain.length; i++){
      const p = terrain[i];
      const sx = p.x - camX;
      if(!drawing){ ctx.moveTo(sx, p.y); drawing = true; } else ctx.lineTo(sx, p.y);
      if(p.gapAfter){ ctx.stroke(); ctx.beginPath(); drawing = false; }
    }
    ctx.stroke();

    // 凍った区間(ice:true / iceberg:true)を専用の色で塗り直し、キラッとした斜線を重ねる
    for(let i = 0; i < terrain.length - 1; i++){
      const a = terrain[i], b = terrain[i+1];
      if(a.gapAfter || !(a.ice || a.iceberg)) continue;
      const ax = a.x - camX, ay = a.y, bx = b.x - camX, by = b.y;
      ctx.fillStyle = THEME.iceFill;
      ctx.strokeStyle = THEME.iceStroke;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.lineTo(bx, 540);
      ctx.lineTo(ax, 540);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.lineTo(bx, 540);
      ctx.lineTo(ax, 540);
      ctx.closePath();
      ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,.55)';
      ctx.lineWidth = 3;
      for(let sx = ax - 40; sx < bx + 40; sx += 26){
        ctx.beginPath();
        ctx.moveTo(sx, 540);
        ctx.lineTo(sx + 60, Math.min(ay, by) - 20);
        ctx.stroke();
      }
      ctx.restore();

      // 氷区間の目印として、氷山っぽい尖った氷の塊を地面から生やす(見た目のみ、当たり判定なし)
      const icebergStart = Math.ceil(a.x / ICEBERG_SPACING) * ICEBERG_SPACING;
      for(let wx = icebergStart; wx < b.x; wx += ICEBERG_SPACING){
        const t2 = (wx - a.x) / (b.x - a.x);
        const gy = a.y + (b.y - a.y) * t2;
        const sx3 = wx - camX;
        const h = 16 + hash01(wx) * 24;
        const w = 32 + hash01(wx * 1.7) * 16;
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.strokeStyle = THEME.iceStroke;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sx3 - w / 2, gy);
        ctx.lineTo(sx3 - w * 0.15, gy - h);
        ctx.lineTo(sx3, gy - h * 0.55);
        ctx.lineTo(sx3 + w * 0.2, gy - h * 1.05);
        ctx.lineTo(sx3 + w / 2, gy);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }

    // goal flag
    const gx = GOAL_X - camX;
    ctx.fillStyle = '#fff';
    ctx.fillRect(gx - 2, GROUND_BASE - 90, 4, 90);
    ctx.fillStyle = '#C8481A';
    ctx.beginPath();
    ctx.moveTo(gx + 2, GROUND_BASE - 90);
    ctx.lineTo(gx + 34, GROUND_BASE - 76);
    ctx.lineTo(gx + 2, GROUND_BASE - 62);
    ctx.closePath();
    ctx.fill();

    if(THEME.decor === 'flowers'){
      // 庭園っぽい小さな花を等間隔に飾る(穴の上には咲かせない)
      const FLOWER_COLORS = ['#fff5c0', '#ffd6e8', '#ffffff'];
      const FLOWER_SPACING = 70;
      const viewStart = Math.floor(camX / FLOWER_SPACING) * FLOWER_SPACING;
      for(let fx = viewStart; fx < camX + 980; fx += FLOWER_SPACING){
        const info = groundInfoAt(fx);
        if(!info) continue;
        const sx2 = fx - camX;
        const fy = info.y - 3;
        const colorIdx = Math.abs(Math.round(fx / FLOWER_SPACING)) % FLOWER_COLORS.length;
        ctx.fillStyle = '#3f8a45';
        ctx.fillRect(sx2 - 1, fy - 6, 2, 6);
        ctx.fillStyle = FLOWER_COLORS[colorIdx];
        for(let k = 0; k < 4; k++){
          const ang = (Math.PI / 2) * k;
          ctx.beginPath();
          ctx.arc(sx2 + Math.cos(ang) * 3, fy - 6 + Math.sin(ang) * 3, 2.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#F3980D';
        ctx.beginPath();
        ctx.arc(sx2, fy - 6, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if(THEME.decor === 'snow'){
      // 凍っていない地面にだけ、小さな雪だまりを等間隔に飾る(氷の上はキラッと線で表現済み)
      const SNOW_SPACING = 70;
      const viewStart = Math.floor(camX / SNOW_SPACING) * SNOW_SPACING;
      for(let fx = viewStart; fx < camX + 980; fx += SNOW_SPACING){
        const info = groundInfoAt(fx);
        if(!info || info.ice || info.iceberg) continue;
        const sx2 = fx - camX;
        const fy = info.y - 2;
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#c9dde8';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(sx2, fy - 2, 5, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }
  }

  function drawCastleBackdrop(){
    // マリオ64のピーチ城の庭っぽい遠景(オリジナル画で再現。実際の画像素材は使用していない)
    const parallaxSky = 0.1, parallaxHill = 0.25;

    // 空の雲
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    const cloudBaseX = -((camX * parallaxSky) % 300);
    for(let i = -1; i < 5; i++){
      const cx = cloudBaseX + i * 300;
      const cy = 70 + (i % 2) * 30;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 34, 16, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 26, cy + 4, 24, 13, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - 26, cy + 6, 22, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 遠くの丘
    const hillBaseX = -((camX * parallaxHill) % 480);
    ctx.fillStyle = '#8fd18a';
    for(let i = -1; i < 4; i++){
      const hx = hillBaseX + i * 480;
      ctx.beginPath();
      ctx.moveTo(hx - 40, GROUND_BASE);
      ctx.quadraticCurveTo(hx + 140, GROUND_BASE - 130, hx + 320, GROUND_BASE);
      ctx.closePath();
      ctx.fill();
    }

    // ピーチ城っぽい城のシルエット(1回だけ、コース序盤の背景に固定)
    // ゴール付近に固定表示(遠景ではなく地形と同じ1:1スクロールにして、
    // ゴールに近づいてもズレずにちゃんとその場に立っているようにする)
    const castleWorldX = GOAL_X - 190;
    const cx = castleWorldX - camX;
    const baseY = GROUND_BASE - 40;
    ctx.fillStyle = '#e9dfc7';
    ctx.strokeStyle = '#b7a67e';
    ctx.lineWidth = 2;
    // 本館
    ctx.fillRect(cx - 55, baseY - 90, 110, 90);
    ctx.strokeRect(cx - 55, baseY - 90, 110, 90);
    // 左右の塔
    [-78, 56].forEach((dx) => {
      ctx.fillRect(cx + dx, baseY - 120, 22, 120);
      ctx.strokeRect(cx + dx, baseY - 120, 22, 120);
      ctx.fillStyle = '#C8481A';
      ctx.beginPath();
      ctx.moveTo(cx + dx - 4, baseY - 120);
      ctx.lineTo(cx + dx + 11, baseY - 150);
      ctx.lineTo(cx + dx + 26, baseY - 120);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#e9dfc7';
    });
    // 中央の塔
    ctx.fillRect(cx - 16, baseY - 160, 32, 160);
    ctx.strokeRect(cx - 16, baseY - 160, 32, 160);
    ctx.fillStyle = '#C8481A';
    ctx.beginPath();
    ctx.moveTo(cx - 20, baseY - 160);
    ctx.lineTo(cx, baseY - 195);
    ctx.lineTo(cx + 20, baseY - 160);
    ctx.closePath();
    ctx.fill();
    // 旗
    ctx.strokeStyle = '#8a7a55';
    ctx.beginPath();
    ctx.moveTo(cx, baseY - 195);
    ctx.lineTo(cx, baseY - 212);
    ctx.stroke();
    ctx.fillStyle = '#F3980D';
    ctx.beginPath();
    ctx.moveTo(cx, baseY - 212);
    ctx.lineTo(cx + 16, baseY - 206);
    ctx.lineTo(cx, baseY - 200);
    ctx.closePath();
    ctx.fill();
    // 円窓
    ctx.fillStyle = '#7fb9e0';
    ctx.beginPath();
    ctx.arc(cx, baseY - 110, 10, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawMountainBackdrop(){
    // さむいさむいマウンテン(ステージ2)の遠景: 雪雲・雪山の稜線・ゴール手前の氷の塔
    const parallaxSky = 0.1, parallaxHill = 0.25;

    // 雪雲
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    const cloudBaseX = -((camX * parallaxSky) % 300);
    for(let i = -1; i < 5; i++){
      const cx0 = cloudBaseX + i * 300;
      const cy = 60 + (i % 2) * 26;
      ctx.beginPath();
      ctx.ellipse(cx0, cy, 32, 15, 0, 0, Math.PI * 2);
      ctx.ellipse(cx0 + 24, cy + 4, 22, 12, 0, 0, Math.PI * 2);
      ctx.ellipse(cx0 - 24, cy + 5, 20, 11, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 遠くの雪山(三角の峰+頂上の雪冠)
    const hillBaseX = -((camX * parallaxHill) % 480);
    for(let i = -1; i < 4; i++){
      const hx = hillBaseX + i * 480;
      ctx.fillStyle = '#7f9ab3';
      ctx.beginPath();
      ctx.moveTo(hx - 60, GROUND_BASE);
      ctx.lineTo(hx + 110, GROUND_BASE - 170);
      ctx.lineTo(hx + 280, GROUND_BASE);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(hx + 110, GROUND_BASE - 170);
      ctx.lineTo(hx + 70, GROUND_BASE - 110);
      ctx.lineTo(hx + 90, GROUND_BASE - 108);
      ctx.lineTo(hx + 110, GROUND_BASE - 132);
      ctx.lineTo(hx + 130, GROUND_BASE - 108);
      ctx.lineTo(hx + 150, GROUND_BASE - 110);
      ctx.closePath();
      ctx.fill();
    }

    // 中景に浮かぶ氷山(遠くの雪山より手前、視差を強めにして奥行きを出す)
    const parallaxIceberg = 0.45;
    const icebergBgBaseX = -((camX * parallaxIceberg) % 340);
    for(let i = -1; i < 4; i++){
      const bx = icebergBgBaseX + i * 340;
      const peakH = 90;
      ctx.fillStyle = '#cfeaf6';
      ctx.strokeStyle = '#9cc7de';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bx - 70, GROUND_BASE + 30);
      ctx.lineTo(bx - 30, GROUND_BASE - peakH);
      ctx.lineTo(bx + 10, GROUND_BASE - peakH * 0.55);
      ctx.lineTo(bx + 45, GROUND_BASE - peakH * 0.85);
      ctx.lineTo(bx + 90, GROUND_BASE + 30);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // 氷山の白いハイライト面
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.beginPath();
      ctx.moveTo(bx - 30, GROUND_BASE - peakH);
      ctx.lineTo(bx + 10, GROUND_BASE - peakH * 0.55);
      ctx.lineTo(bx - 5, GROUND_BASE - peakH * 0.3);
      ctx.closePath();
      ctx.fill();
    }

    // ゴール地点の目印: でっかい雪だるま(ステージ1の城の代わり、背景装飾)
    const towerWorldX = GOAL_X - 190;
    const cx = towerWorldX - camX;
    const towerGroundInfo = groundInfoAt(towerWorldX);
    const baseY = towerGroundInfo ? towerGroundInfo.y : GROUND_BASE;
    const bodyR = 72, headR = 46;
    const bodyCy = baseY - bodyR;
    const headCy = bodyCy - bodyR * 0.85 - headR * 0.85;
    // 腕(木の枝、片手だけ)+ 先端に手袋
    ctx.strokeStyle = '#6b4a2f';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    const armBaseX = cx + bodyR * 0.75, armBaseY = bodyCy - bodyR * 0.1;
    const armEndX = cx + bodyR * 1.5, armEndY = bodyCy - bodyR * 0.55;
    ctx.beginPath();
    ctx.moveTo(armBaseX, armBaseY);
    ctx.lineTo(armEndX, armEndY);
    ctx.stroke();
    ctx.fillStyle = '#d43f3f';
    ctx.strokeStyle = '#a52a2a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(armEndX + 7, armEndY - 5, 13, 10, Math.atan2(armEndY - armBaseY, armEndX - armBaseX), 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#9cc7de';
    ctx.lineWidth = 3;
    for(const [cy, r] of [[bodyCy, bodyR], [headCy, headR]]){
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath();
    ctx.arc(cx - headR * 0.35, headCy - headR * 0.1, headR * 0.13, 0, Math.PI * 2);
    ctx.arc(cx + headR * 0.35, headCy - headR * 0.1, headR * 0.13, 0, Math.PI * 2);
    ctx.arc(cx, bodyCy - bodyR * 0.35, bodyR * 0.11, 0, Math.PI * 2);
    ctx.arc(cx, bodyCy + bodyR * 0.15, bodyR * 0.11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e2882f';
    ctx.beginPath();
    ctx.moveTo(cx, headCy + headR * 0.05);
    ctx.lineTo(cx + headR * 0.6, headCy + headR * 0.2);
    ctx.lineTo(cx, headCy + headR * 0.32);
    ctx.closePath();
    ctx.fill();
  }

  function drawGoalStar(now){
    // ジャンプで届く高さに浮かぶゴールの星。触れる(STAR_Xに到達する)とクリア
    if(STAR_X === GOAL_X) return;
    if(state !== 'play' && state !== 'intro') return;
    const info = groundInfoAt(STAR_X);
    const groundY = info ? info.y : GROUND_BASE;
    const cx = STAR_X - camX;
    if(cx < -40 || cx > 1000) return;
    const bob = Math.sin(now / 260) * 6;
    const spin = now / 900;
    const cy = groundY - 70 + bob;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.save();
    ctx.rotate(spin);
    ctx.fillStyle = '#ffd94a';
    ctx.strokeStyle = '#e0a112';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let i = 0; i < 5; i++){
      const outerAng = -Math.PI / 2 + (Math.PI * 2 * i) / 5;
      const innerAng = outerAng + Math.PI / 5;
      const ox = Math.cos(outerAng) * 26, oy = Math.sin(outerAng) * 26;
      const ix = Math.cos(innerAng) * 11, iy = Math.sin(innerAng) * 11;
      if(i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
      ctx.lineTo(ix, iy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    // マリオ64のスター風の目(星の回転に関わらず正面を向いたまま)
    ctx.fillStyle = '#1c1c1c';
    ctx.strokeStyle = '#d8d8d8';
    ctx.lineWidth = 1;
    for(const dx of [-5, 5]){
      ctx.beginPath();
      ctx.ellipse(dx, 1, 2.6, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSnowfall(now){
    // 画面全体に降り続ける雪(演出のみ、当たり判定なし)
    const t = now / 1000;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for(let i = 0; i < 46; i++){
      const seed = i * 137.51;
      const speed = 40 + (i % 5) * 12;
      const drift = Math.sin(t * 0.6 + i) * 18;
      const x = (((seed * 3.7 + drift) % 1020) + 1020) % 1020 - 20;
      const y = ((seed * 5.3 + t * speed) % 580);
      const r = 1.4 + (i % 3) * 0.8;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawObstacles(){
    for(const ob of OBSTACLES){
      const info = groundInfoAt(ob.x + ob.w / 2);
      const baseY = info ? info.y : GROUND_BASE;
      const gx = ob.x - camX;
      if(ob.penguin){
        if(penguinImg.complete && penguinImg.naturalWidth){
          ctx.drawImage(penguinImg, gx, baseY - ob.h, ob.w, ob.h);
        } else {
          ctx.fillStyle = '#2f7fb8';
          ctx.beginPath();
          ctx.ellipse(gx + ob.w / 2, baseY - ob.h / 2, ob.w / 2, ob.h / 2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        continue;
      }
      if(ob.type === 'rock'){
        // ゴツゴツした岩: 地面に半円状に埋まった輪郭を、頂点ごとに
        // hash01でジッターさせていびつな見た目にする
        const cx = gx + ob.w / 2;
        const pts = 7;
        ctx.fillStyle = THEME.obstacleFill;
        ctx.strokeStyle = THEME.obstacleStroke;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for(let i = 0; i <= pts; i++){
          const t = i / pts;
          const angle = Math.PI + t * Math.PI;
          const jitter = 0.75 + hash01(ob.x * 3.1 + i * 7.7) * 0.35;
          const px = cx + Math.cos(angle) * (ob.w / 2) * jitter;
          const py = baseY + Math.sin(angle) * ob.h * jitter;
          if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        continue;
      }
      if(ob.type === 'snowman'){
        const cx = gx + ob.w / 2;
        const bodyR = ob.w * 0.48;
        const headR = ob.w * 0.32;
        const bodyCy = baseY - bodyR;
        const headCy = bodyCy - bodyR * 0.85 - headR * 0.85;
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#b9d3e0';
        ctx.lineWidth = 2;
        for(const [cy, r] of [[bodyCy, bodyR], [headCy, headR]]){
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        ctx.fillStyle = '#2b2b2b';
        ctx.beginPath();
        ctx.arc(cx - headR * 0.35, headCy - headR * 0.1, headR * 0.12, 0, Math.PI * 2);
        ctx.arc(cx + headR * 0.35, headCy - headR * 0.1, headR * 0.12, 0, Math.PI * 2);
        ctx.arc(cx, bodyCy - bodyR * 0.35, bodyR * 0.13, 0, Math.PI * 2);
        ctx.arc(cx, bodyCy + bodyR * 0.15, bodyR * 0.13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e2882f';
        ctx.beginPath();
        ctx.moveTo(cx, headCy + headR * 0.05);
        ctx.lineTo(cx + headR * 0.55, headCy + headR * 0.18);
        ctx.lineTo(cx, headCy + headR * 0.3);
        ctx.closePath();
        ctx.fill();
        continue;
      }
      if(ob.type === 'fuwafuwa'){
        // ふわふわさん: 葉っぱ襟付きの鉢(左右で色を変えて宝石のような面取り感を出す)+
        // 白い丸顔(目・口)+ 頭上の花。踏むと大ジャンプできるボーナス的な障害物
        const cx = gx + ob.w / 2;
        const potTopY = baseY - ob.h * 0.55;
        const potMidY = baseY - ob.h * 0.22;
        ctx.fillStyle = '#e0c23a';
        ctx.beginPath();
        ctx.moveTo(cx, potTopY);
        ctx.lineTo(cx + ob.w * 0.5, potMidY);
        ctx.lineTo(cx, baseY);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#3f8f4a';
        ctx.beginPath();
        ctx.moveTo(cx, potTopY);
        ctx.lineTo(cx - ob.w * 0.5, potMidY);
        ctx.lineTo(cx, baseY);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#2b5c33';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx - ob.w * 0.5, potMidY);
        ctx.lineTo(cx, potTopY);
        ctx.lineTo(cx + ob.w * 0.5, potMidY);
        ctx.stroke();
        // 頭(白い丸)
        const headR = ob.w * 0.42;
        const headCy = potTopY - headR * 0.75;
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#c9d6da';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, headCy, headR, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#1c1c1c';
        ctx.beginPath();
        ctx.arc(cx - headR * 0.4, headCy - headR * 0.05, headR * 0.16, 0, Math.PI * 2);
        ctx.arc(cx + headR * 0.4, headCy - headR * 0.05, headR * 0.16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#d43f3f';
        ctx.beginPath();
        ctx.arc(cx, headCy + headR * 0.35, headR * 0.14, 0, Math.PI * 2);
        ctx.fill();
        // 頭上の花(花びら5枚+中心)
        const flowerCy = headCy - headR * 0.9;
        const petalR = headR * 0.34;
        for(let p = 0; p < 5; p++){
          const ang = (Math.PI * 2 * p) / 5 - Math.PI / 2;
          ctx.fillStyle = p % 2 === 0 ? '#f06a8a' : '#f7a8c0';
          ctx.beginPath();
          ctx.ellipse(cx + Math.cos(ang) * petalR, flowerCy + Math.sin(ang) * petalR, petalR * 0.85, petalR * 0.5, ang, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#f5d64c';
        ctx.beginPath();
        ctx.arc(cx, flowerCy, petalR * 0.55, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      ctx.fillStyle = THEME.obstacleFill;
      ctx.strokeStyle = THEME.obstacleStroke;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gx, baseY);
      ctx.lineTo(gx + ob.w * 0.3, baseY - ob.h);
      ctx.lineTo(gx + ob.w * 0.7, baseY - ob.h);
      ctx.lineTo(gx + ob.w, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawPipe(){
    const gx = PIPE_X - camX;
    if(gx < -60 || gx > 1020) return;
    ctx.fillStyle = '#3ea62f';
    ctx.strokeStyle = '#245c1b';
    ctx.lineWidth = 3;
    const bodyTop = PIPE_TOP + PIPE_RIM_H;
    // 地面より下は塗っても地形の下に隠れるはずが、地形より後に描画しているため
    // 前面に浮いて見えてしまっていた。地面の高さでぴったり止めて隠れる部分を描かない。
    const groundHereInfo = groundInfoAt(PIPE_X);
    const bodyBottom = groundHereInfo ? groundHereInfo.y : GROUND_BASE;
    ctx.fillRect(gx - PIPE_W / 2 + 5, bodyTop, PIPE_W - 10, bodyBottom - bodyTop);
    ctx.strokeRect(gx - PIPE_W / 2 + 5, bodyTop, PIPE_W - 10, bodyBottom - bodyTop);
    ctx.fillRect(gx - PIPE_W / 2, PIPE_TOP, PIPE_W, PIPE_RIM_H + 4);
    ctx.strokeRect(gx - PIPE_W / 2, PIPE_TOP, PIPE_W, PIPE_RIM_H + 4);
  }

  function drawLegs(phase){
    // 走るモーション: 接地している脚は前→後ろへ蹴り、逆の脚は後ろ→前へ持ち上げて振り戻す
    const hip = { x: 0, y: -14 };
    const stride = 7, lift = 6;
    ctx.strokeStyle = '#e8dcc0';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    for(let i = 0; i < 2; i++){
      const p = phase + i * Math.PI;
      const fx = Math.cos(p) * stride;
      const fy = -Math.max(0, -Math.sin(p)) * lift;
      ctx.beginPath();
      ctx.moveTo(hip.x, hip.y);
      ctx.lineTo(fx, fy);
      ctx.stroke();
      ctx.fillStyle = '#8a6d3b';
      ctx.beginPath(); ctx.arc(fx, fy, 2.4, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawPlayer(){
    const sx = player.x - camX;
    const sy = player.y;
    ctx.save();
    ctx.translate(sx, sy);
    if(player.spinSpeed){
      // 大回転中は足元ではなく、ニンニクマン自身の体の中心を軸に回す
      const pivotY = -20;
      ctx.translate(0, pivotY);
      ctx.rotate(player.angle);
      ctx.translate(0, -pivotY);
    } else {
      ctx.rotate(player.angle);
    }

    drawLegs(player.legPhase);

    // ニンニクマン本体(頭〜腰。脚は上のdrawLegsで表現するため画像下部はクロップ)
    if(charImg.complete && charImg.naturalWidth){
      const cw = 32, srcW = 379, srcH = 300; // 300/400 = 元画像の脚を除いた上半身部分
      const ch = cw * (srcH / srcW);
      const hipY = -14;
      ctx.drawImage(charImg, 0, 0, srcW, srcH, -cw/2, hipY - ch, cw, ch);
      // さむいさむいマウンテン(ステージ2)ではペンギンを抱えて走る
      if(currentStageId === 2 && penguinImg.complete && penguinImg.naturalWidth){
        const pw = 15, ph = 15;
        ctx.drawImage(penguinImg, 7, -30, pw, ph);
      }
    } else {
      ctx.fillStyle = '#F5E7C6';
      ctx.strokeStyle = '#C8481A';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, -33, 11, 13, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  const CHASER_OFFSET = 130; // 追いかけてくるペンギンとの距離(ワールドpx)

  function drawChaserPenguin(now){
    if(currentStageId !== 2) return;
    if(state !== 'play' && state !== 'intro') return;
    const chaseX = player.x - CHASER_OFFSET;
    if(chaseX < 0) return;
    const sx = chaseX - camX;
    if(sx < -40 || sx > 1000) return;
    if(!(penguinImg.complete && penguinImg.naturalWidth)) return;
    const info = groundInfoAt(chaseX);
    const groundY = info ? info.y : GROUND_BASE;
    const bob = Math.abs(Math.sin(now / 110)) * 4;
    const pw = 30, ph = 30;
    ctx.drawImage(penguinImg, sx - pw / 2, groundY - ph - bob, pw, ph);
  }

  function draw(now){
    ctx.clearRect(0, 0, 960, 540);
    // sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, 540);
    grad.addColorStop(0, THEME.sky[0]);
    grad.addColorStop(1, THEME.sky[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 960, 540);

    if(THEME.backdrop === 'mountain') drawMountainBackdrop(); else drawCastleBackdrop();
    drawGround();
    drawObstacles();
    drawGoalStar(now);
    drawPipe();
    drawChaserPenguin(now);
    drawDustPuffs();

    if(state === 'intro' && introPhase === 'rise'){
      // 土管のフチまでせり上がる途中は、フチより下の部分をクリップして隠す
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, 960, PIPE_TOP);
      ctx.clip();
      drawPlayer();
      ctx.restore();
    } else {
      drawPlayer();
    }

    drawComboPopup();
    drawLandingPopup();
    if(THEME.snow) drawSnowfall(now);
  }

  function drawLandingPopup(){
    if(!landingPopup || landingPopup.timer <= 0) return;
    const t = Math.max(0, landingPopup.timer / landingPopup.maxTimer);
    const sx = player.x - camX;
    const sy = player.y - 40 - (1 - t) * 14;
    ctx.save();
    ctx.globalAlpha = Math.min(1, t * 2);
    ctx.font = 'bold 16px "Yu Gothic", Meiryo, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#2b2b2b';
    ctx.fillStyle = landingPopup.color;
    ctx.strokeText(landingPopup.text, sx, sy);
    ctx.fillText(landingPopup.text, sx, sy);
    ctx.restore();
  }

  function drawComboPopup(){
    if(!comboPopup || comboPopup.timer <= 0) return;
    const t = Math.max(0, comboPopup.timer / comboPopup.maxTimer);
    const big = !!comboPopup.big;
    const sx = player.x - camX;
    const sy = player.y - (big ? 76 : 68) - (1 - t) * (big ? 28 : 18);
    ctx.save();
    ctx.globalAlpha = Math.min(1, t * 2);
    ctx.font = 'bold ' + (big ? 26 : 18) + 'px "Yu Gothic", Meiryo, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = big ? 4 : 3;
    ctx.strokeStyle = big ? '#8a1f0a' : '#5b3a1e';
    ctx.fillStyle = big ? '#FFD23F' : '#F3980D';
    ctx.strokeText(comboPopup.text, sx, sy);
    ctx.fillText(comboPopup.text, sx, sy);
    ctx.restore();
  }

  function spawnDustPuff(worldX, groundY){
    for(let i = 0; i < 9; i++){
      const ang = Math.PI + (Math.random() - 0.5) * Math.PI * 0.9; // 主に上向きに広がる
      const speed = 24 + Math.random() * 34;
      dustPuffs.push({
        x: worldX + (Math.random() - 0.5) * 14,
        y: groundY - 2,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        life: 420 + Math.random() * 160,
        maxLife: 580,
        r: 5 + Math.random() * 4,
      });
    }
  }

  function drawDustPuffs(){
    for(const d of dustPuffs){
      const t = Math.max(0, d.life / d.maxLife);
      const sx = d.x - camX;
      ctx.save();
      ctx.globalAlpha = Math.min(1, t * 1.3) * 0.9;
      ctx.fillStyle = '#f5f1e4';
      ctx.strokeStyle = 'rgba(150,138,110,.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(sx, d.y, d.r * (2 - t * 0.7), 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  // ---------- Main loop ----------
  function loop(now){
    if(!lastTime) lastTime = now;
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;

    if(state === 'play') updatePlay(dt);
    else if(state === 'intro') updateIntro(dt);

    draw(now);
    requestAnimationFrame(loop);
  }

  rtaModeBtnEl.addEventListener('click', startRTA);
  retryBtnEl.addEventListener('click', () => retryCurrent());
  backToStartBtnEl.addEventListener('click', backToStart);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);
  document.getElementById('popupBtn').addEventListener('click', () => {
    const w = 1000, h = 620;
    const left = Math.round((window.screen.width - w) / 2);
    const top = Math.round((window.screen.height - h) / 2);
    const popupUrl = location.origin + location.pathname + '?popup=1';
    window.open(
      popupUrl,
      'running-ninniku-popup',
      'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top +
        ',menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=no'
    );
  });

  // ---------- タッチ操作(スマホ向け) ----------
  const isTouchDevice = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  if(isTouchDevice){
    tcLeanBackEl.classList.add('show');
    tcLeanFwdEl.classList.add('show');
    tcHintEl.classList.add('show');
  }
  function bindHoldButton(el, action){
    const press = (e) => { e.preventDefault(); heldActions.add(action); };
    const release = (e) => { if(e) e.preventDefault(); heldActions.delete(action); };
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release);
    el.addEventListener('touchcancel', release);
  }
  bindHoldButton(tcLeanBackEl, 'leanBack');
  bindHoldButton(tcLeanFwdEl, 'leanForward');
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    tryJump();
  }, { passive: false });

  resetPlayer();
  distTotalEl.textContent = Math.round(GOAL_X / 10);
  fitToWindow();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

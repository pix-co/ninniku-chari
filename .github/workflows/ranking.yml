name: Update ranking from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-ranking:
    if: contains(github.event.issue.labels.*.name, 'ranking')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse submission and update ranking file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const RANK_SIZE = 1000;
            const body = context.payload.issue.body || '';

            const getField = (key) => {
              const m = body.match(new RegExp('^' + key + ':\\s*(.*)$', 'mi'));
              return m ? m[1].trim() : '';
            };

            const mode = getField('mode');
            const rawValue = getField('value');
            let name = getField('name').replace(/[\r\n]/g, '').trim().slice(0, 12);
            if (!name) name = '名無しさん';

            const value = Number(rawValue);
            const FILE_BY_MODE = { clear: 'ranking-clear.json', clear2: 'ranking-clear2.json' };
            const validMode = Object.prototype.hasOwnProperty.call(FILE_BY_MODE, mode);
            const validValue = Number.isFinite(value) && value >= 0 && value <= 3600000;

            if (!validMode || !validValue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '内容を読み取れませんでした。ゲーム画面の「ランキングに登録」ボタンから登録し直してください。',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
              return;
            }

            const file = FILE_BY_MODE[mode];
            let list = [];
            try {
              list = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (e) {
              list = [];
            }
            if (!Array.isArray(list)) list = [];

            const better = (a, b) => a < b; // タイムは短いほど上位
            let rank = list.findIndex((e) => better(value, e.value));
            if (rank === -1) rank = list.length;
            const madeIt = rank < RANK_SIZE;

            let comment;
            if (madeIt) {
              list.splice(rank, 0, {
                name,
                value,
                date: new Date().toISOString().slice(0, 10),
              });
              list = list.slice(0, RANK_SIZE);
              fs.writeFileSync(file, JSON.stringify(list, null, 2) + '\n');
              comment = 'ランキング ' + (rank + 1) + ' 位にランクインしました！反映まで数分お待ちください。';
            } else {
              comment = '記録しました（順位 ' + (rank + 1) + ' 位、トップ' + RANK_SIZE + 'には届きませんでした）。';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });

      - name: Commit ranking update
        run: |
          git config user.name "ranking-bot"
          git config user.email "actions@github.com"
          git add ranking-clear.json ranking-clear2.json
          if git diff --cached --quiet; then
            echo "No ranking changes to commit"
          else
            git commit -m "Update ranking from issue #${{ github.event.issue.number }}"
            git push
          fi
